# BigConfig Package Profiles
# Named compositions of providers with application-specific parameters.
#
# A profile selects one provider from each category (smtp, dns, backend, compute)
# and merges them with deploy params and application config.
#
# Consumed by all language implementations to produce the full options map
# that drives validation, rendering, and lifecycle commands.

# ---------------------------------------------------------------------------
# Profile: alpha
# Production-like: DigitalOcean compute, Resend SMTP, Cloudflare DNS, R2 backend
# ---------------------------------------------------------------------------
alpha:
  profile: "profile-alpha"
  providers:
    smtp: resend
    dns: cloudflare
    backend: r2
    compute: digitalocean
  params:
    domain: "alpha.example.com"
    package: "profile-alpha"
    once:
      applications:
        - host: "www.alpha.example.com"
          image: "ghcr.io/bigconfig-ai/once-bigconfig:latest"
        - host: "alpha.example.com"
          image: "ghcr.io/bigconfig-ai/once-caddy-redirect:latest"
        - host: "forms.alpha.example.com"
          image: "ghcr.io/bigconfig-ai/once-forms:latest"
          env:
            - "TARGET_EMAIL=forms@alpha.example.com"

# ---------------------------------------------------------------------------
# Profile: beta
# OCI compute, Resend SMTP, Cloudflare DNS, R2 backend
# ---------------------------------------------------------------------------
beta:
  profile: "profile-beta"
  providers:
    smtp: resend
    dns: cloudflare
    backend: r2
    compute: oci
  params:
    domain: "beta.example.com"
    package: "profile-beta"
    once:
      applications:
        - host: "www.beta.example.com"
          image: "ghcr.io/bigconfig-ai/once-bigconfig"

# ---------------------------------------------------------------------------
# Profile: gamma
# OCI compute, Resend SMTP, Cloudflare DNS, R2 backend
# ---------------------------------------------------------------------------
gamma:
  profile: "profile-gamma"
  providers:
    smtp: resend
    dns: cloudflare
    backend: r2
    compute: oci
  params:
    domain: "gamma.example.com"
    package: "profile-gamma"
    once:
      applications:
        - host: "marketplace-api.gamma.example.com"
          image: "ghcr.io/amiorin/once-pocketbase"
          env:
            - "SUPERUSER_PASSWORD=<{ superuser-password }>"

# ---------------------------------------------------------------------------
# Profile: no-infra
# Bring-your-own-server, local backend, no DNS/SMTP management
# ---------------------------------------------------------------------------
no-infra:
  profile: "profile-no-infra"
  providers:
    compute: no-infra
    smtp: no-infra
    dns: no-infra
    backend: local
  params:
    domain: "no-infra.example.com"
    package: "profile-no-infra"
    once:
      applications:
        - host: "www.no-infra.example.com"
          image: "ghcr.io/bigconfig-ai/once-bigconfig:latest"
