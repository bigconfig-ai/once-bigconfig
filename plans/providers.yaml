# BigConfig Package Providers
# Standard provider parameter definitions.
# Consumed by all language implementations (Clojure, TypeScript, Python, ...).

# ---------------------------------------------------------------------------
# Deploy
# ---------------------------------------------------------------------------
deploy:
  params:
    compute-pubkey:
      type: string
      placeholder: "REPLACE_ME"
      description: "SSH public key for compute node access"
    deploy-pubkey:
      type: string
      placeholder: "REPLACE_ME"
      description: "SSH public key for deployment"

# ---------------------------------------------------------------------------
# SMTP providers
# ---------------------------------------------------------------------------
smtp:
  _dispatch: provider-smtp

  resend:
    params:
      provider-smtp:
        type: string
        value: "resend"
      resend-server:
        type: string
        default: "smtp.resend.com"
      resend-port:
        type: integer
        default: 587
      resend-username:
        type: string
        default: "resend"
      resend-api-key:
        type: string
        placeholder: "REPLACE_ME"
        secret: true
      resend-password:
        type: string
        placeholder: "REPLACE_ME"
        secret: true

  no-infra:
    params:
      provider-smtp:
        type: string
        value: "no-infra"
      no-infra-smtp-server:
        type: string
        default: "smtp.resend.com"
      no-infra-smtp-port:
        type: integer
        default: 587
      no-infra-smtp-username:
        type: string
        default: "resend"
      no-infra-smtp-password:
        type: string
        placeholder: "REPLACE_ME"
        secret: true

# ---------------------------------------------------------------------------
# DNS providers
# ---------------------------------------------------------------------------
dns:
  _dispatch: provider-dns

  cloudflare:
    params:
      provider-dns:
        type: string
        value: "cloudflare"
      cloudflare-api-token:
        type: string
        placeholder: "REPLACE_ME"
        secret: true

  no-infra:
    params:
      provider-dns:
        type: string
        value: "no-infra"

# ---------------------------------------------------------------------------
# Backend (state storage) providers
# ---------------------------------------------------------------------------
backend:
  _dispatch: provider-backend

  s3:
    params:
      provider-backend:
        type: string
        value: "s3"
      s3-bucket:
        type: string
        placeholder: "REPLACE_ME"
      s3-region:
        type: string
        placeholder: "REPLACE_ME"

  r2:
    params:
      provider-backend:
        type: string
        value: "r2"
      r2-bucket:
        type: string
        placeholder: "REPLACE_ME"
      r2-endpoint:
        type: string
        placeholder: "REPLACE_ME"
      r2-access-key-id:
        type: string
        placeholder: "REPLACE_ME"
        secret: true
      r2-secret-access-key:
        type: string
        placeholder: "REPLACE_ME"
        secret: true

  local:
    params:
      provider-backend:
        type: string
        value: "local"

# ---------------------------------------------------------------------------
# Compute providers
# ---------------------------------------------------------------------------
compute:
  _dispatch: provider-compute

  oci:
    params:
      provider-compute:
        type: string
        value: "oci"
      oci-config-file-profile:
        type: string
        default: "DEFAULT"
      oci-subnet-id:
        type: string
        placeholder: "REPLACE_ME"
      oci-compartment-id:
        type: string
        placeholder: "REPLACE_ME"
      oci-availability-domain:
        type: string
        placeholder: "REPLACE_ME"
      oci-display-name:
        type: string
        default: "once"
      oci-shape:
        type: string
        default: "VM.Standard.A1.Flex"
      oci-ocpus:
        type: integer
        default: 1
      oci-memory-in-gbs:
        type: integer
        default: 4
      oci-boot-volume-size-in-gbs:
        type: integer
        default: 50
      oci-boot-volume-vpus-per-gb:
        type: integer
        default: 30
      oci-ssh-authorized-keys:
        type: string
        placeholder: "REPLACE_ME"

  hcloud:
    params:
      provider-compute:
        type: string
        value: "hcloud"
      hcloud-name:
        type: string
        default: "once"
      hcloud-image:
        type: string
        default: "ubuntu-24.04"
      hcloud-server-type:
        type: string
        default: "cx23"
      hcloud-location:
        type: string
        default: "hel1"
      hcloud-ssh-keys:
        type: string
        placeholder: "REPLACE_ME"
      hcloud-token:
        type: string
        placeholder: "REPLACE_ME"
        secret: true

  digitalocean:
    params:
      provider-compute:
        type: string
        value: "digitalocean"
      digitalocean-name:
        type: string
        default: "once"
      digitalocean-region:
        type: string
        default: "ams3"
      digitalocean-size:
        type: string
        default: "s-1vcpu-1gb-35gb-intel"
      digitalocean-image:
        type: string
        default: "ubuntu-25-10-x64"
      digitalocean-vpc-uuid:
        type: string
        placeholder: "REPLACE_ME"
      digitalocean-ssh-keys:
        type: string
        placeholder: "REPLACE_ME"
      do-token:
        type: string
        placeholder: "REPLACE_ME"
        secret: true

  no-infra:
    params:
      provider-compute:
        type: string
        value: "no-infra"
      no-infra-compute-ip:
        type: string
        placeholder: "REPLACE_ME"
      no-infra-compute-user:
        type: string
        placeholder: "REPLACE_ME"
      no-infra-compute-sudoer:
        type: string
        placeholder: "REPLACE_ME"
      no-infra-compute-uid:
        type: string
        placeholder: "REPLACE_ME"
      no-infra-compute-name:
        type: string
        placeholder: "REPLACE_ME"
