<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62e1e9"/>
      <stop offset="0.5" stop-color="#3a8cec"/>
      <stop offset="1" stop-color="#0652e9"/>
    </linearGradient>
    <linearGradient id="price" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a7e84"/>
      <stop offset="0.55" stop-color="#3a8cec"/>
      <stop offset="1" stop-color="#0652e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#0652e9" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="627" fill="#f5f7fa"/>
  <rect width="1200" height="627" fill="url(#brand)" opacity="0.10"/>
  <circle cx="1080" cy="80" r="220" fill="url(#brand)" opacity="0.10"/>
  <circle cx="120" cy="560" r="170" fill="url(#brand)" opacity="0.08"/>

  <!-- brand mark -->
  <text x="600" y="86" text-anchor="middle" font-size="30" font-weight="700" fill="#0a7e84" letter-spacing="2">BIGCONFIG</text>

  <!-- the price -->
  <text x="600" y="232" text-anchor="middle" font-size="150" font-weight="800" fill="url(#price)">$0.013</text>
  <text x="600" y="284" text-anchor="middle" font-size="34" font-weight="700" fill="#16162a">to install BigConfig. End to end.</text>
  <text x="600" y="322" text-anchor="middle" font-size="22" fill="#5a6472">No setup. No docs. Paste one prompt — the AI agent does the rest.</text>

  <!-- terminal window -->
  <g filter="url(#shadow)">
    <rect x="160" y="360" width="880" height="172" rx="16" fill="#16162a"/>
    <rect x="160" y="360" width="880" height="44" rx="16" fill="#23233c"/>
    <rect x="160" y="386" width="880" height="18" fill="#23233c"/>
    <circle cx="194" cy="382" r="7" fill="#ff5f57"/>
    <circle cx="220" cy="382" r="7" fill="#febc2e"/>
    <circle cx="246" cy="382" r="7" fill="#28c840"/>
    <text x="600" y="388" text-anchor="middle" font-size="15" fill="#8a8aa8" letter-spacing="1">agent prompt</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">
      <text x="196" y="448" fill="#62e1e9">▸</text>
      <text x="228" y="448" fill="#e8e8f4">run <tspan fill="#62e1e9">npx bc-pkg bigconfig-ai/once</tspan> <tspan fill="#7fb3ff">validate</tspan></text>
      <text x="228" y="488" fill="#e8e8f4">and iterate on failures</text>
    </g>
  </g>

  <!-- footer -->
  <text x="600" y="582" text-anchor="middle" font-size="21" fill="#5a6472">Powered by deepseek-v4-flash · The first agentic infrastructure package manager · <tspan fill="#0652e9" font-weight="700">bigconfig.ai</tspan></text>
</svg>
