<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Incident in prod - BigConfig agent safety pattern</title>
  <desc id="desc">Marketing slide for DevOps teams showing safe BigConfig package patterns for AI agents and anti-patterns that cause production incidents.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14070a"/>
      <stop offset="0.42" stop-color="#080a12"/>
      <stop offset="1" stop-color="#07162f"/>
    </linearGradient>
    <radialGradient id="red-glow" cx="0.08" cy="0.10" r="0.62">
      <stop offset="0" stop-color="#ff2147" stop-opacity="0.62"/>
      <stop offset="0.35" stop-color="#b91c1c" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue-glow" cx="0.94" cy="0.12" r="0.78">
      <stop offset="0" stop-color="#0652e9" stop-opacity="0.52"/>
      <stop offset="0.45" stop-color="#0652e9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3158"/>
      <stop offset="0.55" stop-color="#ff6b35"/>
      <stop offset="1" stop-color="#62e1e9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62e1e9"/>
      <stop offset="1" stop-color="#0652e9"/>
    </linearGradient>
    <linearGradient id="safe-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#06111f" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="danger-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#ff2147" flood-opacity="0.35"/>
    </filter>
    <filter id="brand-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#62e1e9" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="url(#background)"/>
  <rect width="1200" height="627" fill="url(#red-glow)"/>
  <rect width="1200" height="627" fill="url(#blue-glow)"/>
  <rect width="1200" height="627" fill="url(#grid)"/>
  <path d="M-80 554 C190 464 350 650 610 545 C850 447 982 520 1290 420" fill="none" stroke="#62e1e9" stroke-width="2" stroke-opacity="0.12"/>
  <path d="M-70 93 C178 22 400 150 616 92 C862 28 1038 72 1280 16" fill="none" stroke="#ff3158" stroke-width="2" stroke-opacity="0.14"/>

  <!-- BigConfig brand. Logo paths are inlined from src/assets/logo.svg. -->
  <g transform="translate(46 30)">
    <svg x="0" y="0" width="52" height="36.4" viewBox="0 0 375 262.49999" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <clipPath id="bc-logo-left">
          <path d="M 119.30859,140 H 188 v 60.01953 h -68.69141 z m 0,0" clip-rule="nonzero"/>
        </clipPath>
        <clipPath id="bc-logo-right">
          <path d="m 187,108.51953 h 68.80859 V 169 H 187 Z m 0,0" clip-rule="nonzero"/>
        </clipPath>
      </defs>
      <g transform="matrix(2.6788023,0,0,2.6788023,-299.09503,-331.54731)">
        <g clip-path="url(#bc-logo-left)" transform="translate(-5.8593749,18.479567)">
          <path fill="#0652e9" d="m 165.23047,182.66406 v 8.30078 L 127.63672,173.5 v -6.73438 l 37.59375,-17.46875 v 8.30469 l -28.42969,12.45313 v 0.15625 z m 22.32812,-42.58984 H 124.6875 c -2.96875,0 -5.375,2.40625 -5.375,5.375 v 49.36719 c 0,2.96875 2.40625,5.375 5.375,5.375 h 45.41797 l 17.45312,-60.11719" fill-rule="nonzero"/>
        </g>
        <g clip-path="url(#bc-logo-right)" transform="translate(-5.8593749,18.479567)">
          <path fill="#62e1e9" d="m 247.37891,142.21094 -37.59375,17.23047 v -8.30469 l 29.05468,-12.45313 v -0.15625 l -29.05468,-12.45312 v -8.30078 l 37.59375,17.23047 z m -42.36719,-33.66406 -17.45313,60.11718 h 62.76953 c 2.96485,0 5.3711,-2.40625 5.3711,-5.375 v -49.36718 c 0,-2.96875 -2.40625,-5.375 -5.3711,-5.375 h -45.3164" fill-rule="nonzero"/>
        </g>
      </g>
    </svg>
    <text x="67" y="25" fill="#f8fafc" font-size="23" font-weight="800" letter-spacing="1.8">BIGCONFIG</text>
    <rect x="222" y="2" width="246" height="34" rx="17" fill="#0f172a" stroke="#26334e"/>
    <circle cx="242" cy="19" r="5" fill="#ff3158"/>
    <text x="256" y="24" fill="#cbd5e1" font-size="14" font-weight="700" letter-spacing="1.2">AGENTIC DEVOPS SAFETY</text>
  </g>

  <!-- Hero -->
  <g transform="translate(54 104)">
    <rect x="0" y="0" width="226" height="34" rx="17" fill="#2a0c12" stroke="#ff3158" stroke-opacity="0.52"/>
    <path d="M18 23 L27 8 L36 23 Z" fill="none" stroke="#ff3158" stroke-width="2" stroke-linejoin="round"/>
    <path d="M27 13 v5" stroke="#ff3158" stroke-width="2" stroke-linecap="round"/>
    <circle cx="27" cy="21" r="1.4" fill="#ff3158"/>
    <text x="47" y="23" fill="#ff8a9d" font-size="14" font-weight="800" letter-spacing="1.4">PRODUCTION ALERT</text>

    <text x="0" y="108" fill="url(#danger)" font-size="78" font-weight="900" letter-spacing="-2.5" filter="url(#danger-shadow)">INCIDENT</text>
    <text x="0" y="196" fill="#f8fafc" font-size="86" font-weight="900" letter-spacing="-3">IN PROD</text>

    <text x="2" y="246" fill="#e5e7eb" font-size="30" font-weight="750">
      <tspan>One over-permissioned agent prompt</tspan>
      <tspan x="2" dy="38">can take production down.</tspan>
    </text>
  </g>

  <!-- Safe pattern panel -->
  <g transform="translate(640 94)" filter="url(#soft-shadow)">
    <rect width="512" height="392" rx="28" fill="url(#safe-panel)" stroke="#26334e"/>
    <rect x="1" y="1" width="510" height="390" rx="27" fill="none" stroke="url(#brand)" stroke-opacity="0.28"/>
    <g transform="translate(28 29)">
      <rect x="0" y="0" width="146" height="31" rx="15.5" fill="#062d35" stroke="#62e1e9" stroke-opacity="0.4"/>
      <text x="18" y="21" fill="#62e1e9" font-size="14" font-weight="900" letter-spacing="1.2">SAFE PATTERN</text>
      <text x="0" y="66" fill="#f8fafc" font-size="26" font-weight="850">BigConfig package boundary</text>

      <g font-size="17" font-weight="650" fill="#e2e8f0">
        <g transform="translate(0 101)">
          <circle cx="12" cy="-6" r="12" fill="#052e2f" stroke="#62e1e9" stroke-opacity="0.55"/>
          <path d="M6 -6 l4 4 l8 -9" fill="none" stroke="#62e1e9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="36" y="0">Run the Agent inside a disposable container</text>
        </g>

        <g transform="translate(0 150)">
          <circle cx="12" cy="-6" r="12" fill="#052e2f" stroke="#62e1e9" stroke-opacity="0.55"/>
          <path d="M6 -6 l4 4 l8 -9" fill="none" stroke="#62e1e9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="36" y="0">Implement package verbs</text>
          <g transform="translate(36 16)" font-size="13" font-weight="800" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
            <rect x="0" y="0" width="67" height="26" rx="8" fill="#111827" stroke="#334155"/>
            <text x="13" y="18" fill="#dbeafe">create</text>
            <rect x="78" y="0" width="67" height="26" rx="8" fill="#111827" stroke="#334155"/>
            <text x="93" y="18" fill="#dbeafe">delete</text>
            <rect x="156" y="0" width="78" height="26" rx="8" fill="#111827" stroke="#334155"/>
            <text x="168" y="18" fill="#dbeafe">validate</text>
            <rect x="245" y="0" width="80" height="26" rx="8" fill="#111827" stroke="#334155"/>
            <text x="257" y="18" fill="#dbeafe">describe</text>
          </g>
        </g>

        <g transform="translate(0 231)">
          <circle cx="12" cy="-6" r="12" fill="#052e2f" stroke="#62e1e9" stroke-opacity="0.55"/>
          <path d="M6 -6 l4 4 l8 -9" fill="none" stroke="#62e1e9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="36" y="0"><tspan fill="#f8fafc">Full credentials</tspan> only for: create + delete</text>
        </g>

        <g transform="translate(0 279)">
          <circle cx="12" cy="-6" r="12" fill="#052e2f" stroke="#62e1e9" stroke-opacity="0.55"/>
          <path d="M6 -6 l4 4 l8 -9" fill="none" stroke="#62e1e9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="36" y="0"><tspan fill="#f8fafc">Read-only credentials</tspan> for: validate + describe</text>
        </g>

        <g transform="translate(0 327)">
          <circle cx="12" cy="-6" r="12" fill="#052e2f" stroke="#62e1e9" stroke-opacity="0.55"/>
          <path d="M6 -6 l4 4 l8 -9" fill="none" stroke="#62e1e9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="36" y="0">SSH ForceCommand CLIs instead of MCP</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Anti-pattern panel -->
  <g transform="translate(54 400)" filter="url(#soft-shadow)">
    <rect width="548" height="101" rx="22" fill="#16080c" stroke="#7f1d1d" stroke-opacity="0.75"/>
    <rect x="1" y="1" width="546" height="99" rx="21" fill="none" stroke="#ff3158" stroke-opacity="0.22"/>
    <text x="24" y="32" fill="#ff8a9d" font-size="13" font-weight="900" letter-spacing="1.4">ANTI-PATTERNS</text>
    <g fill="#f1f5f9" font-size="17" font-weight="700">
      <g transform="translate(24 61)">
        <circle cx="8" cy="-6" r="10" fill="#3a1018"/>
        <path d="M4 -10 l8 8 M12 -10 l-8 8" stroke="#ff3158" stroke-width="2.3" stroke-linecap="round"/>
        <text x="30" y="0">Agent has full credentials like the operator</text>
      </g>
      <g transform="translate(24 88)">
        <circle cx="8" cy="-6" r="10" fill="#3a1018"/>
        <path d="M4 -10 l8 8 M12 -10 l-8 8" stroke="#ff3158" stroke-width="2.3" stroke-linecap="round"/>
        <text x="30" y="0">Don't create MCPs for production actions</text>
      </g>
    </g>
  </g>

  <!-- Command CTA -->
  <g transform="translate(54 512)" filter="url(#brand-shadow)">
    <rect width="1092" height="82" rx="23" fill="#050816" stroke="#0652e9" stroke-opacity="0.72"/>
    <rect x="1" y="1" width="1090" height="80" rx="22" fill="none" stroke="#62e1e9" stroke-opacity="0.24"/>
    <text x="32" y="32" fill="#94a3b8" font-size="13" font-weight="800" letter-spacing="1.3">RUN IN A DISPOSABLE CONTAINER</text>
    <text x="32" y="62" fill="#f8fafc" font-size="25" font-weight="800" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <tspan fill="#62e1e9">$</tspan> BB_EDN_REPO=bigconfig-ai/npm-bb npx @bigconfig/bb shell
    </text>
    <text x="1064" y="32" text-anchor="end" fill="#64748b" font-size="13" font-weight="700">bigconfig.ai</text>
  </g>
</svg>
