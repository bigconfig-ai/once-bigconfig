<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62e1e9"/>
      <stop offset="0.5" stop-color="#3a8cec"/>
      <stop offset="1" stop-color="#0652e9"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a7e84"/>
      <stop offset="0.55" stop-color="#3a8cec"/>
      <stop offset="1" stop-color="#0652e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#0652e9" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#f5f7fa"/>
  <rect width="1200" height="630" fill="url(#brand)" opacity="0.10"/>
  <circle cx="1080" cy="90" r="220" fill="url(#brand)" opacity="0.10"/>
  <circle cx="130" cy="560" r="170" fill="url(#brand)" opacity="0.08"/>

  <!-- brand mark -->
  <text x="600" y="92" text-anchor="middle" font-size="30" font-weight="700" fill="#0a7e84" letter-spacing="2">BIGCONFIG</text>

  <!-- headline -->
  <text x="600" y="158" text-anchor="middle" font-size="58" font-weight="800" fill="url(#headline)">Install in one prompt.</text>
  <text x="600" y="200" text-anchor="middle" font-size="24" fill="#5a6472">Paste this into your AI coding agent — it does the rest.</text>

  <!-- terminal window -->
  <g filter="url(#shadow)">
    <rect x="150" y="248" width="900" height="252" rx="16" fill="#16162a"/>
    <rect x="150" y="248" width="900" height="48" rx="16" fill="#23233c"/>
    <rect x="150" y="276" width="900" height="20" fill="#23233c"/>
    <circle cx="186" cy="272" r="8" fill="#ff5f57"/>
    <circle cx="214" cy="272" r="8" fill="#febc2e"/>
    <circle cx="242" cy="272" r="8" fill="#28c840"/>
    <text x="600" y="278" text-anchor="middle" font-size="16" fill="#8a8aa8" letter-spacing="1">agent prompt</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="29">
      <text x="190" y="378" fill="#62e1e9">▸</text>
      <text x="226" y="378" fill="#e8e8f4">run <tspan fill="#62e1e9">npx bc-pkg bigconfig-ai/once</tspan> <tspan fill="#7fb3ff">validate</tspan></text>
      <text x="226" y="426" fill="#e8e8f4">and iterate on failures</text>
    </g>
  </g>

  <!-- footer -->
  <text x="600" y="560" text-anchor="middle" font-size="22" fill="#5a6472">The first agentic infrastructure package manager · <tspan fill="#0652e9" font-weight="700">bigconfig.ai</tspan></text>
</svg>
