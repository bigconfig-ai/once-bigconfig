<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1256" viewBox="0 0 2400 1256" role="img" aria-labelledby="title desc">
  <title id="title">Skills vs. BigConfig Packages</title>
  <desc id="desc">A cover image showing BigConfig packages as more powerful than skills: executable shell-native software packages on the left, agent-native instructions on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef7ff"/>
    </linearGradient>
    <linearGradient id="pkgHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b63ff"/>
      <stop offset="100%" stop-color="#0739a8"/>
    </linearGradient>
    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#063a78" flood-opacity="0.16"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
      .navy { fill: #06152b; }
      .muted { fill: #526177; }
      .blue { fill: #0652e9; }
    </style>
  </defs>

  <rect width="2400" height="1256" fill="url(#bg)"/>

  <!-- Headline -->
  <g class="sans" transform="translate(160 200)">
    <text x="0" y="0" class="navy" font-size="96" font-weight="950" letter-spacing="-3.4">
      <tspan x="0" dy="0">BigConfig packages are</tspan>
      <tspan x="0" dy="116" class="blue">executable software.</tspan>
      <tspan x="0" dy="116">Skills are instructions.</tspan>
    </text>
  </g>

  <!-- Right: Skill card -->
  <g transform="translate(1360 640)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="880" height="460" rx="40" fill="#ffffff" stroke="#d7e7f5" stroke-width="2"/>
    <g class="sans" transform="translate(56 56)">
      <rect x="0" y="0" width="150" height="56" rx="28" fill="#eef4fb" stroke="#dbe8f7"/>
      <text x="30" y="37" class="muted" font-size="24" font-weight="900">SKILL</text>
      <text x="0" y="130" class="navy" font-size="54" font-weight="950" letter-spacing="-1.4">Agent-native</text>
      <text x="0" y="184" class="muted" font-size="30" font-weight="700">Instructions for one runtime</text>

      <g transform="translate(0 248)">
        <text x="0" y="0" class="muted" font-size="29" font-weight="700">
          <tspan x="0" dy="0">• Lives inside the agent</tspan>
          <tspan x="0" dy="52">• Portable knowledge</tspan>
          <tspan x="0" dy="52">• No library reuse</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- Comparison mark -->
  <g class="sans" transform="translate(1180 800)">
    <text x="0" y="120" class="blue" font-size="150" font-weight="950">&gt;</text>
  </g>

  <!-- Left: BigConfig package card -->
  <g transform="translate(160 640)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="960" height="460" rx="40" fill="#ffffff" stroke="#c8def4" stroke-width="2"/>
    <path d="M0 40 a40 40 0 0 1 40 -40 H920 a40 40 0 0 1 40 40 V150 H0 Z" fill="url(#pkgHead)"/>
    <g class="sans" transform="translate(56 56)">
      <text x="0" y="0" fill="#62e1e9" font-size="24" font-weight="900" letter-spacing="2.2">BIGCONFIG PACKAGE</text>
      <text x="0" y="56" fill="#ffffff" font-size="50" font-weight="950" letter-spacing="-1.6">Shell-native software</text>
    </g>

    <!-- Terminal -->
    <g transform="translate(56 196)">
      <rect x="0" y="0" width="848" height="208" rx="24" fill="#06152b"/>
      <circle cx="32" cy="32" r="8" fill="#ff6b6b"/>
      <circle cx="60" cy="32" r="8" fill="#ffd166"/>
      <circle cx="88" cy="32" r="8" fill="#62e1e9"/>
      <text x="36" y="92" class="mono" fill="#b9d3f4" font-size="28" font-weight="800">$ npx bc-pkg describe</text>
      <text x="36" y="138" class="mono" fill="#62e1e9" font-size="28" font-weight="800">$ npx bc-pkg validate</text>
      <text x="36" y="184" class="mono" fill="#ffffff" font-size="28" font-weight="800">$ npx bc-pkg create</text>
    </g>
  </g>

  <!-- Bottom claim -->
  <g class="sans" transform="translate(160 1150)">
    <text x="0" y="0" class="navy" font-size="34" font-weight="900" letter-spacing="-0.4">
      Runs everywhere: <tspan class="blue">humans, agents, CI, scripts, containers</tspan>
    </text>
  </g>
</svg>
