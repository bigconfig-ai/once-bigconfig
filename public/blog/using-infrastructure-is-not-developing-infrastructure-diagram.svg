<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="925" viewBox="0 0 1600 925" role="img" aria-labelledby="title desc">
  <title id="title">Package usage versus package development</title>
  <desc id="desc">A comparison of raw Terraform, where consumers and authors work in the same repository, and BigConfig, where consumers operate a package instance while authors develop package source.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="bc" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="0.55" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0891b2"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1600" height="925" fill="#f8fafc"/>
  <circle cx="250" cy="160" r="280" fill="#94a3b8" opacity="0.10"/>
  <circle cx="1320" cy="170" r="320" fill="#62e1e9" opacity="0.16"/>
  <circle cx="1180" cy="880" r="300" fill="#0652e9" opacity="0.10"/>

  <text x="80" y="94" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="850" fill="#0f172a" letter-spacing="-1">Two jobs need two interfaces</text>
  <text x="80" y="133" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#64748b">Using one deployment instance is not the same workflow as developing the reusable package source.</text>

  <!-- Vanilla Terraform panel -->
  <g filter="url(#shadow)">
    <rect x="80" y="190" width="690" height="640" rx="30" fill="url(#panel)" stroke="#e2e8f0"/>
  </g>
  <text x="122" y="248" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="850" fill="#334155">Vanilla Terraform</text>
  <text x="122" y="282" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="#64748b">Usage and development often collapse into one repository.</text>

  <rect x="153" y="337" width="210" height="66" rx="18" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="258" y="365" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#334155">consumer</text>
  <text x="258" y="388" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#64748b">delivery team / agent</text>

  <rect x="487" y="337" width="210" height="66" rx="18" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="592" y="365" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#334155">author</text>
  <text x="592" y="388" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#64748b">platform team</text>

  <path d="M258 414 C258 456 344 462 425 475" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <path d="M592 414 C592 456 506 462 425 475" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-slate)"/>

  <rect x="210" y="485" width="430" height="96" rx="22" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="425" y="523" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="850" fill="#9a3412">same Terraform repository</text>
  <text x="425" y="552" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#9a3412">.tf · modules · providers · state</text>

  <line x1="425" y1="594" x2="425" y2="643" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-slate)"/>

  <rect x="170" y="658" width="510" height="86" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="425" y="693" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#334155">terraform validate · terraform plan</text>
  <text x="425" y="722" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#334155">terraform apply</text>

  <text x="122" y="790" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="#64748b">Result: the low-level tool is the public interface.</text>

  <!-- BigConfig panel -->
  <g filter="url(#shadow)">
    <rect x="830" y="190" width="690" height="640" rx="30" fill="url(#bc)" stroke="#bae6fd"/>
  </g>
  <text x="872" y="248" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="850" fill="#075985">BigConfig package model</text>
  <text x="872" y="282" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="#0e7490">Consumers and authors get different repositories and commands.</text>

  <rect x="875" y="334" width="280" height="80" rx="20" fill="#ffffff" stroke="#67e8f9"/>
  <text x="1015" y="365" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="850" fill="#155e75">package consumer</text>
  <text x="1015" y="391" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#0e7490">delivery team / agent</text>

  <rect x="1195" y="334" width="280" height="80" rx="20" fill="#ffffff" stroke="#93c5fd"/>
  <text x="1335" y="365" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="850" fill="#1d4ed8">package author</text>
  <text x="1335" y="391" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#2563eb">platform team</text>

  <line x1="1015" y1="428" x2="1015" y2="472" stroke="#0891b2" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  <line x1="1335" y1="428" x2="1335" y2="472" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="875" y="490" width="280" height="96" rx="22" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="1015" y="527" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="850" fill="#155e75">package instance repo</text>
  <text x="1015" y="556" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#155e75">run · manifest · params</text>

  <rect x="1195" y="490" width="280" height="96" rx="22" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="1335" y="527" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="850" fill="#1e40af">package source repo</text>
  <text x="1335" y="556" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1e40af">workflow · templates · tests</text>

  <line x1="1015" y1="600" x2="1015" y2="642" stroke="#0891b2" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  <line x1="1335" y1="600" x2="1335" y2="642" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="875" y="658" width="280" height="86" rx="20" fill="#ffffff" stroke="#67e8f9"/>
  <text x="1015" y="692" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#155e75">package validate</text>
  <text x="1015" y="721" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#155e75">create</text>

  <rect x="1195" y="658" width="280" height="86" rx="20" fill="#ffffff" stroke="#93c5fd"/>
  <text x="1335" y="692" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#1e40af">npx . tofu render</text>
  <text x="1335" y="721" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#1e40af">tofu:init -- tofu plan</text>

  <text x="872" y="790" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="#0e7490">Result: low-level tools stay inside the package source.</text>

  <line x1="1155" y1="538" x2="1195" y2="538" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 7" marker-end="url(#arrow-cyan)"/>
  <text x="1175" y="522" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#0e7490">pinned package</text>
</svg>
