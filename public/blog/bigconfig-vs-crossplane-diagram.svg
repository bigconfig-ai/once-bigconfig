<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1090" viewBox="0 0 1800 1090" role="img" aria-labelledby="title desc">
  <title id="title">Crossplane Kubernetes API boundary versus BigConfig package boundary</title>
  <desc id="desc">A comparison diagram showing Crossplane routing operations through Kubernetes APIs and reconciliation while BigConfig lets agents, operators, CI, containers, and backend apps run package commands with tools inside the package.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eefaff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#62e1e9"/>
      <stop offset="0.5" stop-color="#3a8cec"/>
      <stop offset="1" stop-color="#0652e9"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f2347"/>
      <stop offset="1" stop-color="#06152b"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#d6e9f8" opacity="0.52"/>
    </pattern>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#063a78" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="28" markerHeight="28" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="28" markerHeight="28" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0652e9"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
      .navy { fill: #06152b; }
      .muted { fill: #526177; }
      .blueText { fill: #0652e9; }
      .orangeText { fill: #c2410c; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1800" height="1090" rx="28" fill="url(#bg)"/>
  <rect width="1800" height="1090" fill="url(#dots)" opacity="0.55"/>

  <g class="sans" transform="translate(80 78)">
    <text x="0" y="0" class="navy" font-size="58" font-weight="950" letter-spacing="-1.8">Replace the Kubernetes API boundary</text>
    <text x="0" y="64" class="muted" font-size="28" font-weight="750">Crossplane makes Kubernetes the runtime. BigConfig makes the package the runtime boundary.</text>
  </g>

  <!-- Crossplane column -->
  <g transform="translate(80 198)" filter="url(#shadow)">
    <rect x="0" y="0" width="760" height="784" rx="38" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <path d="M0 38 a38 38 0 0 1 38 -38 H722 a38 38 0 0 1 38 38 V128 H0 Z" fill="#fff7ed"/>
    <g class="sans" transform="translate(44 52)">
      <text x="0" y="0" class="orangeText" font-size="23" font-weight="950" letter-spacing="2.2">CROSSPLANE</text>
      <text x="0" y="58" class="navy" font-size="42" font-weight="950" letter-spacing="-1.1">Kubernetes as public interface</text>
    </g>

    <g class="sans" transform="translate(62 172)">
      <rect x="0" y="0" width="636" height="86" rx="28" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="34" y="54" class="muted" font-size="26" font-weight="900">agent · operator · CI</text>
    </g>
    <path d="M380 278 L380 350" stroke="#c2410c" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowOrange)"/>

    <g class="sans" transform="translate(62 360)">
      <rect x="0" y="0" width="636" height="122" rx="30" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="34" y="48" class="orangeText" font-size="26" font-weight="950">Kubernetes API boundary</text>
      <text x="34" y="88" class="mono orangeText" font-size="22" font-weight="800">claims · composites · managed resources</text>
    </g>
    <path d="M380 502 L380 570" stroke="#c2410c" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowOrange)"/>

    <g class="sans" transform="translate(62 582)">
      <text x="0" y="0" class="muted" font-size="23" font-weight="850">Kubernetes tax</text>
      <g transform="translate(0 26)">
        <rect x="0" y="0" width="196" height="48" rx="24" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="29" y="32" class="orangeText" font-size="21" font-weight="950">providers</text>
      </g>
      <g transform="translate(216 26)">
        <rect x="0" y="0" width="196" height="48" rx="24" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="40" y="32" class="orangeText" font-size="21" font-weight="950">RBAC</text>
      </g>
      <g transform="translate(432 26)">
        <rect x="0" y="0" width="196" height="48" rx="24" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="31" y="32" class="orangeText" font-size="21" font-weight="950">finalizers</text>
      </g>
      <g transform="translate(0 88)">
        <rect x="0" y="0" width="196" height="48" rx="24" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="35" y="32" class="orangeText" font-size="21" font-weight="950">events</text>
      </g>
      <g transform="translate(216 88)">
        <rect x="0" y="0" width="196" height="48" rx="24" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="28" y="32" class="orangeText" font-size="21" font-weight="950">conditions</text>
      </g>
      <g transform="translate(432 88)">
        <rect x="0" y="0" width="196" height="48" rx="24" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="31" y="32" class="orangeText" font-size="21" font-weight="950">upgrades</text>
      </g>
    </g>

    <g class="mono" transform="translate(62 760)">
      <text x="0" y="0" class="orangeText" font-size="21" font-weight="850">API first, then MCP/adapter for agents</text>
    </g>
  </g>

  <!-- BigConfig column -->
  <g transform="translate(960 198)" filter="url(#shadow)">
    <rect x="0" y="0" width="760" height="784" rx="38" fill="#ffffff" stroke="#c8def4" stroke-width="2"/>
    <path d="M0 38 a38 38 0 0 1 38 -38 H722 a38 38 0 0 1 38 38 V128 H0 Z" fill="url(#dark)"/>
    <g class="sans" transform="translate(44 52)">
      <text x="0" y="0" fill="#62e1e9" font-size="23" font-weight="950" letter-spacing="2.2">BIGCONFIG</text>
      <text x="0" y="58" class="white" font-size="42" font-weight="950" letter-spacing="-1.1">Executable package boundary</text>
    </g>

    <g class="sans" transform="translate(62 172)">
      <rect x="0" y="0" width="636" height="86" rx="28" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="34" y="54" class="muted" font-size="26" font-weight="900">agent + package on the same computer</text>
    </g>
    <path d="M380 278 L380 344" stroke="#0652e9" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

    <g class="sans" transform="translate(62 354)">
      <rect x="0" y="0" width="636" height="112" rx="30" fill="url(#blue)"/>
      <text x="38" y="68" class="white" font-size="34" font-weight="950" letter-spacing="-0.8">package validate create describe</text>
    </g>
    <path d="M380 488 L380 548" stroke="#0652e9" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

    <g class="sans" transform="translate(62 558)">
      <text x="0" y="0" class="muted" font-size="23" font-weight="850">same code reused by</text>
      <g transform="translate(0 26)">
        <rect x="0" y="0" width="196" height="48" rx="24" fill="#ecfeff" stroke="#a5f3fc"/>
        <text x="56" y="32" class="blueText" font-size="21" font-weight="950">CLI</text>
      </g>
      <g transform="translate(216 26)">
        <rect x="0" y="0" width="196" height="48" rx="24" fill="#ecfeff" stroke="#a5f3fc"/>
        <text x="50" y="32" class="blueText" font-size="21" font-weight="950">agent</text>
      </g>
      <g transform="translate(432 26)">
        <rect x="0" y="0" width="196" height="48" rx="24" fill="#ecfeff" stroke="#a5f3fc"/>
        <text x="66" y="32" class="blueText" font-size="21" font-weight="950">CI</text>
      </g>
      <g transform="translate(0 88)">
        <rect x="0" y="0" width="196" height="48" rx="24" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="30" y="32" class="blueText" font-size="21" font-weight="950">containers</text>
      </g>
      <g transform="translate(216 88)">
        <rect x="0" y="0" width="196" height="48" rx="24" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="24" y="32" class="blueText" font-size="21" font-weight="950">backend app</text>
      </g>
      <g transform="translate(432 88)">
        <rect x="0" y="0" width="196" height="48" rx="24" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="39" y="32" class="blueText" font-size="21" font-weight="950">operator</text>
      </g>
    </g>

    <g class="sans" transform="translate(62 728)">
      <rect x="0" y="0" width="636" height="48" rx="20" fill="#f7fbff" stroke="#d7e7f5"/>
      <text x="24" y="31" class="mono muted" font-size="19" font-weight="850">inside: OpenTofu · Ansible · Helm · APIs · Kubernetes</text>
    </g>
  </g>

  <g class="sans" transform="translate(80 1026)">
    <text x="0" y="0" class="muted" font-size="22" font-weight="850">Server-side automation stays for autonomous loops like autoscaling.</text>
    <text x="0" y="34" class="muted" font-size="22" font-weight="850">Human-in-the-loop work can stay with the agent, operator, package, and container credential boundary.</text>
  </g>
</svg>
