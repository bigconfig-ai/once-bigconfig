<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1256" viewBox="0 0 2400 1256" role="img" aria-labelledby="title desc">
  <title id="title">Announcing the BigConfig Package Spec</title>
  <desc id="desc">A cover image showing the BigConfig Package Spec as a small contract connecting bc-pkg, package repositories, lifecycle verbs, TypeScript, Python, Clojure targets, and generated artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eaf7ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#62e1e9"/>
      <stop offset="45%" stop-color="#3a8cec"/>
      <stop offset="100%" stop-color="#0652e9"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2347"/>
      <stop offset="100%" stop-color="#06152b"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#d6e9f8" opacity="0.55"/>
    </pattern>
    <filter id="cardShadow" x="-14%" y="-14%" width="128%" height="128%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#063a78" flood-opacity="0.16"/>
    </filter>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="26" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.023 0 0 0 0 0.322 0 0 0 0 0.914 0 0 0 0.25 0"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0652e9"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
      .navy { fill: #06152b; }
      .muted { fill: #526177; }
      .blue { fill: #0652e9; }
      .cyan { fill: #62e1e9; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="2400" height="1256" fill="url(#bg)"/>
  <rect width="2400" height="1256" fill="url(#dots)" opacity="0.52"/>
  <circle cx="2080" cy="180" r="300" fill="#62e1e9" opacity="0.18" filter="url(#softGlow)"/>
  <circle cx="260" cy="1100" r="270" fill="#0652e9" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Headline -->
  <g class="sans" transform="translate(150 145)">
    <rect x="0" y="0" width="346" height="54" rx="27" fill="#ffffff" stroke="#cfe4f5" stroke-width="2"/>
    <circle cx="31" cy="27" r="7" fill="#62e1e9"/>
    <text x="52" y="35" class="blue" font-size="22" font-weight="950" letter-spacing="2.2">PACKAGE SPEC</text>

    <text x="0" y="146" class="navy" font-size="94" font-weight="950" letter-spacing="-3.6">
      <tspan x="0" dy="0">BigConfig packages need</tspan>
      <tspan x="0" dy="110">a small executable contract.</tspan>
    </text>
    <text x="0" y="375" font-size="54" font-weight="950" letter-spacing="-1.4" fill="url(#accent)">
      one manifest · one run file · one lifecycle
    </text>
    <text x="0" y="448" class="muted" font-size="31" font-weight="750">
      TypeScript · Python · Clojure targets
    </text>
  </g>

  <!-- Main contract card -->
  <g transform="translate(150 650)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="760" height="440" rx="40" fill="#ffffff" stroke="#c8def4" stroke-width="2"/>
    <path d="M0 40 a40 40 0 0 1 40 -40 H720 a40 40 0 0 1 40 40 V136 H0 Z" fill="url(#dark)"/>
    <g class="sans" transform="translate(48 54)">
      <text x="0" y="0" fill="#62e1e9" font-size="24" font-weight="950" letter-spacing="2.2">REPOSITORY CONTRACT</text>
      <text x="0" y="60" fill="#ffffff" font-size="46" font-weight="950" letter-spacing="-1.4">What bc-pkg can run</text>
    </g>

    <g class="mono" transform="translate(56 170)" font-weight="850">
      <text x="0" y="0" class="navy" font-size="30">my-package/</text>

      <g transform="translate(0 38)">
        <rect x="0" y="0" width="306" height="226" rx="24" fill="#f7fbff" stroke="#d7e7f5"/>
        <text x="24" y="38" class="blue" font-size="26">manifest</text>
        <text x="42" y="72" class="muted" font-size="22">• package.json</text>
        <text x="42" y="102" class="muted" font-size="22">• pyproject.toml</text>
        <text x="42" y="132" class="muted" font-size="22">• deps.edn</text>
        <line x1="24" y1="156" x2="282" y2="156" stroke="#d7e7f5" stroke-width="2"/>
        <text x="24" y="188" class="blue" font-size="23">run</text>
        <text x="122" y="188" class="muted" font-size="20">argv handoff</text>
        <text x="24" y="214" class="blue" font-size="23">resources</text>
        <text x="154" y="214" class="muted" font-size="20">templates</text>
      </g>

      <g transform="translate(346 38)">
        <rect x="0" y="0" width="306" height="226" rx="24" fill="#f7fbff" stroke="#d7e7f5"/>
        <text x="24" y="38" class="blue" font-size="26">lifecycle</text>
        <text x="42" y="78" class="muted" font-size="24">• validate</text>
        <text x="42" y="112" class="muted" font-size="24">• build</text>
        <text x="42" y="146" class="muted" font-size="24">• create</text>
        <text x="42" y="180" class="muted" font-size="24">• describe</text>
        <text x="42" y="214" class="muted" font-size="24">• delete</text>
      </g>
    </g>
  </g>

  <!-- Flow arrows -->
  <path d="M960 860 C1030 860 1060 860 1138 860" fill="none" stroke="#0652e9" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.9"/>
  <path d="M1614 860 C1688 860 1724 860 1806 860" fill="none" stroke="#0652e9" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.9"/>

  <!-- Launcher card -->
  <g transform="translate(1080 698)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="560" height="324" rx="36" fill="#ffffff" stroke="#c8def4" stroke-width="2"/>
    <g class="sans" transform="translate(42 42)">
      <rect x="0" y="0" width="154" height="46" rx="23" fill="#eaf7ff" stroke="#bfe5f7"/>
      <text x="26" y="31" class="blue" font-size="21" font-weight="950" letter-spacing="1.8">bc-pkg</text>
      <text x="0" y="104" class="navy" font-size="46" font-weight="950" letter-spacing="-1.2">Pin or link</text>
      <text x="0" y="157" class="muted" font-size="29" font-weight="750">GitHub SHA or local path</text>
    </g>
    <g class="mono" transform="translate(42 226)">
      <rect x="0" y="0" width="476" height="62" rx="18" fill="#06152b"/>
      <text x="24" y="40" fill="#62e1e9" font-size="25" font-weight="850">$ npx bc-pkg ... validate</text>
    </g>
  </g>

  <!-- Artifact card -->
  <g transform="translate(1760 650)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="490" height="440" rx="40" fill="#ffffff" stroke="#c8def4" stroke-width="2"/>
    <g class="sans" transform="translate(44 48)">
      <rect x="0" y="0" width="154" height="46" rx="23" fill="#ecfdf5" stroke="#bbf7d0"/>
      <text x="26" y="31" fill="#16a34a" font-size="21" font-weight="950" letter-spacing="1.8">OUTPUT</text>
      <text x="0" y="104" class="navy" font-size="44" font-weight="950" letter-spacing="-1.2">Artifacts</text>
      <text x="0" y="156" class="muted" font-size="29" font-weight="750">inspectable files in .dist</text>
    </g>
    <g transform="translate(44 244)">
      <rect x="0" y="0" width="402" height="120" rx="24" fill="#f7fbff" stroke="#d7e7f5"/>
      <g class="sans" font-size="24" font-weight="850">
        <text x="28" y="45" class="blue">✓ plans</text>
        <text x="210" y="45" class="blue">✓ config</text>
        <text x="28" y="88" class="blue">✓ reports</text>
        <text x="210" y="88" class="blue">✓ inventory</text>
      </g>
    </g>
  </g>

  <!-- Bottom language pills -->
  <g class="sans" transform="translate(150 1138)">
    <rect x="0" y="0" width="2100" height="74" rx="37" fill="#ffffff" stroke="#d8e7f5" stroke-width="2" opacity="0.94"/>
    <text x="42" y="48" class="muted" font-size="26" font-weight="850">Target packages:</text>
    <g transform="translate(310 14)">
      <rect x="0" y="0" width="230" height="46" rx="23" fill="#eaf3ff" stroke="#bfdbfe"/>
      <text x="38" y="31" fill="#2f74c0" font-size="22" font-weight="950">TypeScript</text>
    </g>
    <g transform="translate(570 14)">
      <rect x="0" y="0" width="190" height="46" rx="23" fill="#eef7ff" stroke="#bfdbfe"/>
      <text x="38" y="31" fill="#3572a5" font-size="22" font-weight="950">Python</text>
    </g>
    <g transform="translate(790 14)">
      <rect x="0" y="0" width="190" height="46" rx="23" fill="#f0f5ff" stroke="#c7d2fe"/>
      <text x="38" y="31" fill="#5881d8" font-size="22" font-weight="950">Clojure</text>
    </g>
    <text x="1060" y="48" class="blue" font-size="26" font-weight="950">validate · build · create · describe · delete</text>
  </g>
</svg>
