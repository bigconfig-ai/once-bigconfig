<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-labelledby="title desc">
  <title id="title">BigConfig vs. Crossplane</title>
  <desc id="desc">Crossplane exposes infrastructure through Kubernetes APIs while BigConfig exposes executable package commands that agents, operators, CI, and backend apps can run.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#62e1e9"/>
      <stop offset="0.52" stop-color="#3a8cec"/>
      <stop offset="1" stop-color="#0652e9"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f2347"/>
      <stop offset="1" stop-color="#06152b"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.8" fill="#d6e9f8" opacity="0.58"/>
    </pattern>
    <filter id="shadow" x="-14%" y="-14%" width="128%" height="128%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#063a78" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0652e9"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
      .navy { fill: #06152b; }
      .muted { fill: #526177; }
      .blueText { fill: #0652e9; }
      .orangeText { fill: #c2410c; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="628" fill="url(#bg)"/>
  <rect width="1200" height="628" fill="url(#dots)" opacity="0.55"/>
  <circle cx="1050" cy="95" r="225" fill="#62e1e9" opacity="0.18"/>
  <circle cx="92" cy="555" r="245" fill="#0652e9" opacity="0.10"/>

  <g class="sans" transform="translate(62 48)">
    <rect x="0" y="0" width="344" height="34" rx="17" fill="#ecfeff" stroke="#67e8f9"/>
    <circle cx="22" cy="17" r="5" fill="#0891b2"/>
    <text x="38" y="23" font-size="14" font-weight="850" fill="#0891b2" letter-spacing="1.4">BIGCONFIG REPLACES CROSSPLANE</text>

    <text x="0" y="98" class="navy" font-size="48" font-weight="950" letter-spacing="-1.4">
      <tspan x="0" dy="0">APIs in Kubernetes</tspan>
      <tspan x="0" dy="55">or packages you run?</tspan>
    </text>
    <text x="0" y="228" class="muted" font-size="22" font-weight="750">
      <tspan x="0" dy="0">The runtime boundary matters for</tspan>
      <tspan x="0" dy="32">agents, operators, CI, and control planes.</tspan>
    </text>
  </g>

  <g filter="url(#shadow)" transform="translate(64 334)">
    <rect x="0" y="0" width="322" height="190" rx="26" fill="#ffffff" stroke="#fed7aa"/>
    <path d="M0 26 a26 26 0 0 1 26 -26 H296 a26 26 0 0 1 26 26 V70 H0 Z" fill="url(#warn)"/>
    <text x="28" y="45" class="sans orangeText" font-size="17" font-weight="950" letter-spacing="1.5">CROSSPLANE</text>
    <text x="28" y="103" class="sans navy" font-size="26" font-weight="950">Kubernetes API first</text>
    <text x="28" y="142" class="mono orangeText" font-size="16" font-weight="800">CRDs · claims · controllers</text>
    <text x="28" y="170" class="mono orangeText" font-size="16" font-weight="800">RBAC · finalizers · providers</text>
  </g>

  <path d="M414 430 C465 430 492 430 538 430" fill="none" stroke="#0652e9" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.9"/>
  <text x="422" y="396" class="sans muted" font-size="15" font-weight="850">replace boundary</text>

  <g filter="url(#shadow)" transform="translate(554 286)">
    <rect x="0" y="0" width="582" height="288" rx="32" fill="#ffffff" stroke="#c8def4"/>
    <path d="M0 32 a32 32 0 0 1 32 -32 H550 a32 32 0 0 1 32 32 V98 H0 Z" fill="url(#dark)"/>
    <text x="34" y="45" class="sans" fill="#62e1e9" font-size="18" font-weight="950" letter-spacing="1.6">BIGCONFIG</text>
    <text x="34" y="77" class="sans white" font-size="31" font-weight="950" letter-spacing="-0.6">Executable package boundary</text>

    <g class="sans" transform="translate(34 116)">
      <rect x="0" y="0" width="238" height="48" rx="24" fill="url(#blue)"/>
      <text x="25" y="31" class="white" font-size="19" font-weight="950">package validate</text>
      <rect x="258" y="0" width="238" height="48" rx="24" fill="#ecfeff" stroke="#a5f3fc"/>
      <text x="286" y="31" class="blueText" font-size="19" font-weight="950">package create</text>

      <rect x="0" y="72" width="238" height="48" rx="24" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="28" y="103" class="blueText" font-size="19" font-weight="950">agent + operator</text>
      <rect x="258" y="72" width="238" height="48" rx="24" fill="#f8fafc" stroke="#dbe7f4"/>
      <text x="286" y="103" class="muted" font-size="19" font-weight="950">backend app later</text>
    </g>

    <g transform="translate(34 248)">
      <rect x="0" y="0" width="496" height="34" rx="17" fill="#f7fbff" stroke="#d7e7f5"/>
      <text x="22" y="23" class="mono muted" font-size="15" font-weight="800">inside: OpenTofu · Ansible · Helm · APIs · Kubernetes</text>
    </g>
  </g>

  <text x="64" y="586" class="sans muted" font-size="16" font-weight="750">Control plane API is not the holy grail. Package logic is reusable across CLI, agents, CI, containers, and backend apps.</text>
</svg>
