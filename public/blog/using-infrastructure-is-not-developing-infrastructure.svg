<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-labelledby="title desc">
  <title id="title">Using Infrastructure Is Not Developing Infrastructure</title>
  <desc id="desc">Raw Terraform uses one repository and one tool interface for consumers and authors. BigConfig separates package consumers using an instance repository from package authors developing source.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#62e1e9"/>
      <stop offset="0.52" stop-color="#3a8cec"/>
      <stop offset="1" stop-color="#0652e9"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0891b2"/>
    </marker>
  </defs>

  <rect width="1200" height="628" fill="#f8fafc"/>
  <circle cx="1035" cy="96" r="230" fill="#62e1e9" opacity="0.18"/>
  <circle cx="980" cy="560" r="260" fill="#0652e9" opacity="0.12"/>
  <circle cx="106" cy="538" r="230" fill="#3a8cec" opacity="0.10"/>
  <path d="M0 520 C180 470 300 620 500 570 C700 520 760 410 980 450 C1080 468 1140 520 1200 500 L1200 628 L0 628 Z" fill="#e0f2fe" opacity="0.38"/>

  <g transform="translate(64 54)">
    <rect x="0" y="0" width="254" height="34" rx="17" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="18" y="23" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0891b2">BigConfig package model</text>
  </g>

  <text x="64" y="142" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="850" fill="#0f172a" letter-spacing="-1.5">
    <tspan x="64" dy="0">Using infrastructure</tspan>
    <tspan x="64" dy="58">is not developing it</tspan>
  </text>

  <text x="64" y="275" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#475569">
    <tspan x="64" dy="0">Consumers operate package instances.</tspan>
    <tspan x="64" dy="31">Authors develop package source.</tspan>
  </text>

  <g filter="url(#shadow)">
    <rect x="64" y="356" width="330" height="198" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="92" y="394" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="800" fill="#334155">Raw Terraform</text>
    <rect x="92" y="414" width="274" height="44" rx="13" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="112" y="442" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#475569">consumer / author</text>
    <line x1="229" y1="466" x2="229" y2="488" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="92" y="496" width="274" height="38" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="112" y="521" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9a3412">same repo · terraform apply</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="438" y="330" width="316" height="224" rx="24" fill="url(#soft)" stroke="#bae6fd"/>
    <text x="466" y="368" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="800" fill="#075985">Package consumer</text>
    <rect x="466" y="392" width="260" height="48" rx="14" fill="#ffffff" stroke="#bae6fd"/>
    <text x="486" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f172a">my-app-infra</text>
    <line x1="596" y1="449" x2="596" y2="478" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="466" y="486" width="260" height="42" rx="13" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="486" y="513" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#155e75">package validate create</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="790" y="330" width="346" height="224" rx="24" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="818" y="368" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="800" fill="#1d4ed8">Package author</text>
    <rect x="818" y="392" width="290" height="48" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="838" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f172a">app-platform source</text>
    <line x1="963" y1="449" x2="963" y2="478" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="818" y="486" width="290" height="42" rx="13" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="838" y="512" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1e3a8a">npx . tofu render · plan</text>
  </g>

  <text x="64" y="594" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#64748b">Same low-level tools inside. Different interfaces outside.</text>
</svg>
