<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">Old low-level infrastructure interface versus package program interface</title>
  <desc id="desc">A diagram contrasting delivery teams, agents, and CI calling raw low-level tools with a new model where they call an infrastructure program package that exposes domain verbs and hides Terraform, Helm, Ansible, Kubernetes operators, and APIs inside.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eefaff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#62e1e9"/>
      <stop offset="50%" stop-color="#3a8cec"/>
      <stop offset="100%" stop-color="#0652e9"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2347"/>
      <stop offset="100%" stop-color="#06152b"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#d6e9f8" opacity="0.52"/>
    </pattern>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#063a78" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="28" markerHeight="28" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="28" markerHeight="28" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0652e9"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
      .navy { fill: #06152b; }
      .muted { fill: #526177; }
      .blueText { fill: #0652e9; }
      .orangeText { fill: #c2410c; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1800" height="1040" rx="28" fill="url(#bg)"/>
  <rect width="1800" height="1040" fill="url(#dots)" opacity="0.55"/>

  <g class="sans" transform="translate(80 76)">
    <text x="0" y="0" class="navy" font-size="58" font-weight="950" letter-spacing="-1.8">Change the public interface</text>
    <text x="0" y="64" class="muted" font-size="28" font-weight="750">Keep platform tools inside the package. Expose domain verbs outside.</text>
  </g>

  <!-- Old column -->
  <g transform="translate(80 190)" filter="url(#shadow)">
    <rect x="0" y="0" width="760" height="800" rx="38" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <path d="M0 38 a38 38 0 0 1 38 -38 H722 a38 38 0 0 1 38 38 V126 H0 Z" fill="#fff7ed"/>
    <g class="sans" transform="translate(44 52)">
      <text x="0" y="0" class="orangeText" font-size="23" font-weight="950" letter-spacing="2.2">OLD</text>
      <text x="0" y="58" class="navy" font-size="42" font-weight="950" letter-spacing="-1.1">Low-level tools as the interface</text>
    </g>

    <g class="sans" transform="translate(62 170)">
      <rect x="0" y="0" width="636" height="92" rx="28" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="34" y="57" class="muted" font-size="27" font-weight="900">delivery team · agent · CI</text>
    </g>
    <path d="M380 282 L380 372" stroke="#c2410c" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowOrange)"/>

    <g class="mono" transform="translate(62 382)" font-weight="850">
      <rect x="0" y="0" width="636" height="180" rx="28" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="34" y="64" class="orangeText" font-size="27">Terraform apply · Helm install</text>
      <text x="34" y="118" class="orangeText" font-size="27">YAML · operator-specific APIs</text>
    </g>
    <path d="M380 584 L380 668" stroke="#c2410c" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowOrange)"/>

    <g class="sans" transform="translate(62 676)">
      <rect x="0" y="0" width="636" height="72" rx="24" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
      <text x="25" y="44" class="orangeText" font-size="24" font-weight="900">low-level tool knowledge leaks to every user</text>
    </g>
  </g>

  <!-- New column -->
  <g transform="translate(960 190)" filter="url(#shadow)">
    <rect x="0" y="0" width="760" height="800" rx="38" fill="#ffffff" stroke="#c8def4" stroke-width="2"/>
    <path d="M0 38 a38 38 0 0 1 38 -38 H722 a38 38 0 0 1 38 38 V126 H0 Z" fill="url(#dark)"/>
    <g class="sans" transform="translate(44 52)">
      <text x="0" y="0" fill="#62e1e9" font-size="23" font-weight="950" letter-spacing="2.2">NEW</text>
      <text x="0" y="58" class="white" font-size="42" font-weight="950" letter-spacing="-1.1">Package program as the interface</text>
    </g>

    <g class="sans" transform="translate(62 170)">
      <rect x="0" y="0" width="636" height="92" rx="28" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="34" y="57" class="muted" font-size="27" font-weight="900">delivery team · agent · CI · control plane</text>
    </g>
    <path d="M380 282 L380 356" stroke="#0652e9" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

    <g class="sans" transform="translate(62 366)">
      <rect x="0" y="0" width="636" height="112" rx="30" fill="url(#blue)"/>
      <text x="40" y="70" class="white" font-size="34" font-weight="950" letter-spacing="-0.8">infrastructure program/package</text>
    </g>
    <path d="M380 500 L380 560" stroke="#0652e9" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

    <g class="sans" transform="translate(62 570)">
      <text x="0" y="0" class="muted" font-size="23" font-weight="850">domain verbs</text>
      <g transform="translate(0 24)">
        <rect x="0" y="0" width="178" height="48" rx="24" fill="#ecfeff" stroke="#a5f3fc"/>
        <text x="26" y="32" class="blueText" font-size="22" font-weight="950">validate</text>
      </g>
      <g transform="translate(198 24)">
        <rect x="0" y="0" width="178" height="48" rx="24" fill="#ecfeff" stroke="#a5f3fc"/>
        <text x="25" y="32" class="blueText" font-size="22" font-weight="950">describe</text>
      </g>
      <g transform="translate(396 24)">
        <rect x="0" y="0" width="210" height="48" rx="24" fill="#ecfeff" stroke="#a5f3fc"/>
        <text x="25" y="32" class="blueText" font-size="22" font-weight="950">cost-analysis</text>
      </g>
      <g transform="translate(0 86)">
        <rect x="0" y="0" width="178" height="48" rx="24" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="29" y="32" class="blueText" font-size="22" font-weight="950">backup</text>
      </g>
      <g transform="translate(198 86)">
        <rect x="0" y="0" width="178" height="48" rx="24" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="24" y="32" class="blueText" font-size="22" font-weight="950">upgrade</text>
      </g>
      <g transform="translate(396 86)">
        <rect x="0" y="0" width="210" height="48" rx="24" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="42" y="32" class="blueText" font-size="22" font-weight="950">rollback</text>
      </g>
    </g>

    <path d="M380 708 L380 742" stroke="#0652e9" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

    <text x="62" y="740" class="muted sans" font-size="22" font-weight="900">inside the package</text>
    <g class="sans" transform="translate(62 748)">
      <rect x="0" y="0" width="636" height="44" rx="18" fill="#f7fbff" stroke="#d7e7f5" stroke-width="2"/>
      <text x="28" y="29" class="muted" font-size="20" font-weight="900">Terraform · Helm · Ansible · operators · APIs</text>
    </g>
  </g>
</svg>
