<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1256" viewBox="0 0 2400 1256" role="img" aria-labelledby="title desc">
  <title id="title">Agentic DevOps for the CTO</title>
  <desc id="desc">A light-mode executive cover image for CTOs showing an AI agent contained in a read-only sandbox, a locked production environment, and a human approval gate for create and delete actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#f6fbff"/>
      <stop offset="100%" stop-color="#eef7ff"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="82%" cy="22%" r="58%">
      <stop offset="0%" stop-color="#62e1e9" stop-opacity="0.34"/>
      <stop offset="52%" stop-color="#62e1e9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#62e1e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="navyGlow" cx="14%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#0652e9" stop-opacity="0.16"/>
      <stop offset="58%" stop-color="#0652e9" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0652e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#0652e9" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#063a78" flood-opacity="0.16"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#063a78" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0652e9"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#149aa6"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .navy { fill: #06152b; }
      .muted { fill: #526177; }
      .blue { fill: #0652e9; }
      .cyan { fill: #149aa6; }
      .danger { fill: #dc2626; }
      .panel { fill: #ffffff; stroke: #dbe8f7; }
      .thin { stroke: #dbe8f7; }
    </style>
  </defs>

  <rect width="2400" height="1256" fill="url(#bg)"/>
  <rect width="2400" height="1256" fill="url(#grid)"/>
  <rect width="2400" height="1256" fill="url(#blueGlow)"/>
  <rect width="2400" height="1256" fill="url(#navyGlow)"/>

  <circle cx="2150" cy="110" r="260" fill="#62e1e9" opacity="0.13"/>
  <circle cx="122" cy="1110" r="330" fill="#0652e9" opacity="0.08"/>

  <!-- Top badge -->
  <g transform="translate(1832 84)" filter="url(#smallShadow)">
    <rect x="0" y="0" width="408" height="68" rx="34" fill="#ffffff" stroke="#d8e8f7"/>
    <circle cx="42" cy="34" r="9" fill="#62e1e9"/>
    <text x="66" y="43" class="sans navy" font-size="23" font-weight="850" letter-spacing="1.8">CTO BRIEFING</text>
  </g>

  <!-- Main headline -->
  <g class="sans" transform="translate(126 242)">
    <text x="0" y="0" class="navy" font-size="112" font-weight="900" letter-spacing="-4">
      <tspan x="0" dy="0">Your AI Agent Wants</tspan>
      <tspan x="0" dy="118">Production Access.</tspan>
    </text>
    <text x="0" y="266" font-size="132" font-weight="950" letter-spacing="-5">
      <tspan class="danger">Say no.</tspan>
      <tspan class="navy"> Govern it.</tspan>
    </text>
    <text x="4" y="356" class="muted" font-size="40" font-weight="550" letter-spacing="-0.4">
      <tspan x="4" dy="0">Get agentic DevOps leverage without betting production</tspan>
      <tspan x="4" dy="54">on a prompt.</tspan>
    </text>
  </g>

  <!-- Pull quote -->
  <g transform="translate(126 720)" filter="url(#softShadow)">
    <rect x="0" y="0" width="978" height="150" rx="34" fill="#06152b"/>
    <path d="M 48 45 C 48 28 62 18 82 18 H 142 C 114 43 105 70 112 102 H 58 C 51 86 48 67 48 45 Z" fill="#62e1e9" opacity="0.28"/>
    <text x="76" y="92" class="sans" fill="#ffffff" font-size="44" font-weight="850" letter-spacing="-0.8">The agent advises. The operator acts.</text>
    <text x="78" y="124" class="sans" fill="#b9d3f4" font-size="20" font-weight="700" letter-spacing="1.8">A DEFENSIBLE OPERATING MODEL FOR AGENTIC DEVOPS</text>
  </g>

  <!-- Principle chips -->
  <g class="sans" transform="translate(126 936)">
    <g filter="url(#smallShadow)">
      <rect x="0" y="0" width="270" height="72" rx="36" fill="#ffffff" stroke="#d9e9f6"/>
      <circle cx="42" cy="36" r="13" fill="#0652e9" opacity="0.14"/>
      <path d="M35 36l5 6 12-14" fill="none" stroke="#0652e9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="45" class="navy" font-size="24" font-weight="850">Sandboxed</text>
    </g>
    <g transform="translate(300 0)" filter="url(#smallShadow)">
      <rect x="0" y="0" width="270" height="72" rx="36" fill="#ffffff" stroke="#d9e9f6"/>
      <circle cx="42" cy="36" r="13" fill="#62e1e9" opacity="0.28"/>
      <path d="M36 37 h12 m-6 -6 v12" stroke="#149aa6" stroke-width="5" stroke-linecap="round"/>
      <text x="70" y="45" class="navy" font-size="24" font-weight="850">Read-only</text>
    </g>
    <g transform="translate(600 0)" filter="url(#smallShadow)">
      <rect x="0" y="0" width="342" height="72" rx="36" fill="#ffffff" stroke="#d9e9f6"/>
      <circle cx="42" cy="36" r="13" fill="#dc2626" opacity="0.13"/>
      <path d="M35 36 h14" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
      <text x="70" y="45" class="navy" font-size="24" font-weight="850">Bounded blast radius</text>
    </g>
  </g>

  <!-- Executive architecture card -->
  <g transform="translate(1236 240)" filter="url(#softShadow)">
    <rect x="0" y="0" width="1012" height="790" rx="54" fill="#ffffff" stroke="#d7e7f5"/>
    <rect x="38" y="38" width="936" height="714" rx="40" fill="#f8fbff" stroke="#e2edf8"/>

    <!-- Sandbox -->
    <g transform="translate(76 86)">
      <rect x="0" y="0" width="390" height="500" rx="38" fill="#ffffff" stroke="#62e1e9" stroke-width="5" stroke-dasharray="18 14"/>
      <rect x="30" y="34" width="330" height="64" rx="24" fill="#e9fbfd"/>
      <text x="58" y="76" class="sans navy" font-size="29" font-weight="900">Agent sandbox</text>

      <!-- Agent head -->
      <g transform="translate(108 132)">
        <rect x="0" y="42" width="174" height="144" rx="38" fill="#f4fbff" stroke="#bfeef3" stroke-width="4"/>
        <rect x="36" y="0" width="102" height="64" rx="28" fill="#e1f9fc" stroke="#62e1e9" stroke-width="4"/>
        <circle cx="58" cy="32" r="8" fill="#0652e9"/>
        <circle cx="116" cy="32" r="8" fill="#0652e9"/>
        <path d="M69 71 h36" stroke="#149aa6" stroke-width="5" stroke-linecap="round"/>
        <path d="M-26 108 h26 M174 108 h26" stroke="#bfeef3" stroke-width="8" stroke-linecap="round"/>
        <circle cx="48" cy="123" r="11" fill="#62e1e9" opacity="0.8"/>
        <circle cx="126" cy="123" r="11" fill="#62e1e9" opacity="0.8"/>
      </g>

      <g transform="translate(36 374)">
        <rect x="0" y="0" width="148" height="52" rx="26" fill="#eaf4ff" stroke="#bad6fb"/>
        <text x="28" y="34" class="mono blue" font-size="21" font-weight="800">describe</text>
        <rect x="170" y="0" width="148" height="52" rx="26" fill="#e9fbfd" stroke="#b7edf2"/>
        <text x="206" y="34" class="mono cyan" font-size="21" font-weight="800">validate</text>
      </g>
    </g>

    <!-- Read-only key -->
    <g transform="translate(520 144)">
      <path d="M 42 118 C 18 118 0 100 0 76 C 0 52 18 34 42 34 C 63 34 79 48 83 68 H 270 V 94 H 236 V 125 H 205 V 94 H 83 C 79 109 63 118 42 118 Z" fill="#e9fbfd" stroke="#62e1e9" stroke-width="5"/>
      <circle cx="42" cy="76" r="16" fill="#ffffff" stroke="#149aa6" stroke-width="5"/>
      <text x="0" y="166" class="sans navy" font-size="28" font-weight="900">Read-only credentials</text>
      <text x="1" y="202" class="sans muted" font-size="22" font-weight="600">Inspect. Compare. Explain.</text>
    </g>

    <!-- Production -->
    <g transform="translate(590 376)">
      <rect x="0" y="0" width="316" height="220" rx="38" fill="#06152b"/>
      <text x="40" y="60" class="sans" fill="#ffffff" font-size="34" font-weight="900">Production</text>
      <text x="42" y="96" class="sans" fill="#b9d3f4" font-size="22" font-weight="650">Full authority stays here</text>
      <g transform="translate(104 116)">
        <path d="M36 54 V34 C36 14 51 0 72 0 C93 0 108 14 108 34 V54" fill="none" stroke="#62e1e9" stroke-width="10" stroke-linecap="round"/>
        <rect x="20" y="50" width="104" height="82" rx="18" fill="#e9fbfd"/>
        <circle cx="72" cy="88" r="10" fill="#0652e9"/>
        <path d="M72 98 v18" stroke="#0652e9" stroke-width="8" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Human approval -->
    <g transform="translate(156 632)">
      <rect x="0" y="0" width="694" height="74" rx="37" fill="#ffffff" stroke="#d7e7f5"/>
      <circle cx="42" cy="37" r="22" fill="#0652e9" opacity="0.12"/>
      <path d="M33 41 l7 7 18-24" fill="none" stroke="#0652e9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="47" class="sans navy" font-size="27" font-weight="900">Human approval gate:</text>
      <text x="374" y="47" class="mono danger" font-size="25" font-weight="900">create</text>
      <text x="470" y="47" class="sans muted" font-size="25" font-weight="700">/</text>
      <text x="495" y="47" class="mono danger" font-size="25" font-weight="900">delete</text>
    </g>

    <!-- Arrows and boundary -->
    <path d="M 466 332 C 538 324 570 292 594 244" fill="none" stroke="#149aa6" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowCyan)"/>
    <path d="M 466 384 C 535 408 552 446 586 486" fill="none" stroke="#0652e9" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
    <line x1="534" y1="338" x2="534" y2="590" stroke="#dc2626" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 14"/>
    <g transform="translate(494 286) rotate(-90)">
      <text x="0" y="0" class="sans danger" font-size="18" font-weight="900" letter-spacing="2.4">NO PROD CREDS IN SANDBOX</text>
    </g>
  </g>

  <!-- Footer title -->
  <g class="sans" transform="translate(126 1128)">
    <text x="0" y="0" class="blue" font-size="30" font-weight="900">Agentic DevOps for the CTO</text>
    <text x="0" y="44" class="muted" font-size="24" font-weight="650">Sandbox the agent. Scope credentials read-only. Keep create/delete human.</text>
  </g>
</svg>
