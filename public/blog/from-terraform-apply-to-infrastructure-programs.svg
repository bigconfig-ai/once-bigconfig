<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1256" viewBox="0 0 2400 1256" role="img" aria-labelledby="title desc">
  <title id="title">From Terraform Apply to Infrastructure Programs</title>
  <desc id="desc">A cover image showing low-level infrastructure tools inside a BigConfig package that exposes higher-level lifecycle verbs to agents, shells, CI, and control planes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="46%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#62e1e9"/>
      <stop offset="48%" stop-color="#3a8cec"/>
      <stop offset="100%" stop-color="#0652e9"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2347"/>
      <stop offset="100%" stop-color="#06152b"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="good" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#d6e9f8" opacity="0.58"/>
    </pattern>
    <filter id="cardShadow" x="-14%" y="-14%" width="128%" height="128%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#063a78" flood-opacity="0.16"/>
    </filter>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.023 0 0 0 0 0.322 0 0 0 0 0.914 0 0 0 0.25 0"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0652e9"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
      .navy { fill: #06152b; }
      .muted { fill: #526177; }
      .blue { fill: #0652e9; }
      .cyan { fill: #62e1e9; }
      .white { fill: #ffffff; }
      .orange { fill: #c2410c; }
      .green { fill: #15803d; }
    </style>
  </defs>

  <rect width="2400" height="1256" fill="url(#bg)"/>
  <rect width="2400" height="1256" fill="url(#dots)" opacity="0.52"/>
  <circle cx="2100" cy="170" r="310" fill="#62e1e9" opacity="0.18" filter="url(#softGlow)"/>
  <circle cx="240" cy="1100" r="300" fill="#0652e9" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Headline -->
  <g class="sans" transform="translate(150 126)">
    <rect x="0" y="0" width="454" height="54" rx="27" fill="#ffffff" stroke="#cfe4f5" stroke-width="2"/>
    <circle cx="31" cy="27" r="7" fill="#62e1e9"/>
    <text x="52" y="35" class="blue" font-size="22" font-weight="950" letter-spacing="2.2">INFRASTRUCTURE PROGRAMS</text>

    <text x="0" y="146" class="navy" font-size="93" font-weight="950" letter-spacing="-3.6">
      <tspan x="0" dy="0">From Terraform Apply</tspan>
      <tspan x="0" dy="108">to Infrastructure Programs</tspan>
    </text>
    <text x="0" y="374" font-size="50" font-weight="950" letter-spacing="-1.2" fill="url(#accent)">
      keep tools inside · expose verbs outside
    </text>
    <text x="0" y="444" class="muted" font-size="31" font-weight="750">
      agents · shells · CI · control planes
    </text>
  </g>

  <!-- Old interface card -->
  <g transform="translate(150 650)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="610" height="382" rx="38" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <path d="M0 38 a38 38 0 0 1 38 -38 H572 a38 38 0 0 1 38 38 V126 H0 Z" fill="url(#warn)"/>
    <g class="sans" transform="translate(44 50)">
      <text x="0" y="0" class="orange" font-size="23" font-weight="950" letter-spacing="2.2">OLD PUBLIC INTERFACE</text>
      <text x="0" y="58" class="navy" font-size="43" font-weight="950" letter-spacing="-1.2">Tool verbs leak out</text>
    </g>
    <g class="mono" transform="translate(44 168)" font-weight="850">
      <rect x="0" y="0" width="522" height="168" rx="24" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="30" y="48" class="orange" font-size="29">terraform apply</text>
      <text x="30" y="91" class="orange" font-size="29">helm upgrade</text>
      <text x="30" y="134" class="orange" font-size="29">kubectl apply -f</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M810 842 C900 842 952 842 1045 842" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" marker-end="url(#arrowSlate)" opacity="0.75"/>
  <g class="sans" transform="translate(824 788)">
    <text x="0" y="0" class="muted" font-size="25" font-weight="850">not enough</text>
  </g>

  <!-- Program card -->
  <g transform="translate(1050 574)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="745" height="540" rx="46" fill="#ffffff" stroke="#c8def4" stroke-width="2"/>
    <path d="M0 46 a46 46 0 0 1 46 -46 H699 a46 46 0 0 1 46 46 V160 H0 Z" fill="url(#dark)"/>
    <g class="sans" transform="translate(54 62)">
      <text x="0" y="0" fill="#62e1e9" font-size="24" font-weight="950" letter-spacing="2.2">PACKAGE PROGRAM</text>
      <text x="0" y="66" fill="#ffffff" font-size="50" font-weight="950" letter-spacing="-1.4">Domain verbs outside</text>
    </g>

    <g class="sans" transform="translate(54 206)">
      <text x="0" y="0" class="muted" font-size="26" font-weight="850">public command surface</text>
      <g transform="translate(0 30)">
        <rect x="0" y="0" width="196" height="52" rx="26" fill="#ecfeff" stroke="#a5f3fc"/>
        <text x="34" y="35" class="blue" font-size="23" font-weight="950">validate</text>
      </g>
      <g transform="translate(216 30)">
        <rect x="0" y="0" width="198" height="52" rx="26" fill="#ecfeff" stroke="#a5f3fc"/>
        <text x="33" y="35" class="blue" font-size="23" font-weight="950">describe</text>
      </g>
      <g transform="translate(434 30)">
        <rect x="0" y="0" width="196" height="52" rx="26" fill="#ecfeff" stroke="#a5f3fc"/>
        <text x="48" y="35" class="blue" font-size="23" font-weight="950">backup</text>
      </g>
      <g transform="translate(0 98)">
        <rect x="0" y="0" width="196" height="52" rx="26" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="35" y="35" class="blue" font-size="23" font-weight="950">upgrade</text>
      </g>
      <g transform="translate(216 98)">
        <rect x="0" y="0" width="198" height="52" rx="26" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="36" y="35" class="blue" font-size="23" font-weight="950">rollback</text>
      </g>
      <g transform="translate(434 98)">
        <rect x="0" y="0" width="196" height="52" rx="26" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="43" y="35" class="blue" font-size="23" font-weight="950">audit</text>
      </g>
    </g>

    <g class="mono" transform="translate(54 408)">
      <rect x="0" y="0" width="637" height="82" rx="24" fill="#f7fbff" stroke="#d7e7f5"/>
      <text x="30" y="52" class="muted" font-size="25" font-weight="850">inside: Terraform · Helm · Ansible · APIs</text>
    </g>
  </g>

  <!-- Caller card -->
  <g transform="translate(1855 650)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="395" height="382" rx="38" fill="#ffffff" stroke="#c8def4" stroke-width="2"/>
    <path d="M0 38 a38 38 0 0 1 38 -38 H357 a38 38 0 0 1 38 38 V126 H0 Z" fill="url(#good)"/>
    <g class="sans" transform="translate(38 50)">
      <text x="0" y="0" class="blue" font-size="23" font-weight="950" letter-spacing="2.2">CALLERS</text>
      <text x="0" y="58" class="navy" font-size="42" font-weight="950" letter-spacing="-1.2">One interface</text>
    </g>
    <g class="sans" transform="translate(44 164)" font-size="28" font-weight="900">
      <text x="0" y="0" class="muted">agent</text>
      <text x="0" y="48" class="muted">shell</text>
      <text x="0" y="96" class="muted">CI</text>
      <text x="0" y="144" class="muted">control plane</text>
    </g>
  </g>

  <path d="M1798 842 C1818 842 1828 842 1845 842" fill="none" stroke="#0652e9" stroke-width="8" stroke-linecap="round" marker-end="url(#arrowBlue)" opacity="0.9"/>

  <!-- Bottom ribbon -->
  <g class="sans" transform="translate(150 1142)">
    <rect x="0" y="0" width="2100" height="74" rx="37" fill="#ffffff" stroke="#d8e7f5" stroke-width="2" opacity="0.94"/>
    <text x="42" y="48" class="muted" font-size="26" font-weight="850">BigConfig:</text>
    <text x="190" y="48" class="blue" font-size="26" font-weight="950">Like Skills, but executable · The Open Agent Packages Ecosystem</text>
  </g>
</svg>
