<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-labelledby="title desc">
  <title id="title">Tool Commands Are Not Product Interfaces</title>
  <desc id="desc">Delivery teams and agents ask product-level infrastructure questions while platforms often expose low-level tool commands.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#62e1e9"/>
      <stop offset="0.52" stop-color="#3a8cec"/>
      <stop offset="1" stop-color="#0652e9"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f2347"/>
      <stop offset="1" stop-color="#06152b"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="softWarn" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.8" fill="#d6e9f8" opacity="0.58"/>
    </pattern>
    <filter id="shadow" x="-14%" y="-14%" width="128%" height="128%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#063a78" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0652e9"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
      .navy { fill: #06152b; }
      .muted { fill: #526177; }
      .blueText { fill: #0652e9; }
      .cyanText { fill: #0891b2; }
      .orangeText { fill: #c2410c; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="628" fill="url(#bg)"/>
  <rect width="1200" height="628" fill="url(#dots)" opacity="0.55"/>
  <circle cx="1040" cy="86" r="230" fill="#62e1e9" opacity="0.18"/>
  <circle cx="90" cy="560" r="250" fill="#0652e9" opacity="0.10"/>

  <g class="sans" transform="translate(62 46)">
    <rect x="0" y="0" width="248" height="34" rx="17" fill="#ecfeff" stroke="#67e8f9"/>
    <circle cx="22" cy="17" r="5" fill="#0891b2"/>
    <text x="38" y="23" font-size="14" font-weight="850" fill="#0891b2" letter-spacing="1.4">PUBLIC INTERFACE</text>

    <text x="0" y="92" class="navy" font-size="50" font-weight="950" letter-spacing="-1.5">
      <tspan x="0" dy="0">Tool Commands Are Not</tspan>
      <tspan x="0" dy="57">Product Interfaces</tspan>
    </text>
    <text x="0" y="222" class="muted" font-size="22" font-weight="750">
      <tspan x="0" dy="0">Delivery teams and agents ask domain questions.</tspan>
      <tspan x="0" dy="31">Tool verbs answer implementation questions.</tspan>
    </text>
  </g>

  <g filter="url(#shadow)" transform="translate(62 318)">
    <rect x="0" y="0" width="474" height="234" rx="28" fill="#ffffff" stroke="#bdebf7"/>
    <path d="M0 28 a28 28 0 0 1 28 -28 H446 a28 28 0 0 1 28 28 V74 H0 Z" fill="url(#softBlue)"/>
    <text x="30" y="47" class="sans cyanText" font-size="17" font-weight="950" letter-spacing="1.5">WHAT TEAMS AND AGENTS ASK</text>

    <g class="sans" font-size="23" font-weight="850" transform="translate(34 104)">
      <text x="0" y="0" class="navy">Can I deploy this?</text>
      <text x="0" y="35" class="navy">Is the environment valid?</text>
      <text x="0" y="70" class="navy">What changed?</text>
      <text x="0" y="105" class="navy">Can I roll back?</text>
    </g>
  </g>

  <path d="M560 430 C592 430 608 430 638 430" fill="none" stroke="#0652e9" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.9"/>
  <text x="560" y="395" class="sans muted" font-size="16" font-weight="850">wrong layer</text>

  <g filter="url(#shadow)" transform="translate(664 318)">
    <rect x="0" y="0" width="474" height="234" rx="28" fill="#ffffff" stroke="#fed7aa"/>
    <path d="M0 28 a28 28 0 0 1 28 -28 H446 a28 28 0 0 1 28 28 V74 H0 Z" fill="url(#softWarn)"/>
    <text x="30" y="47" class="sans orangeText" font-size="17" font-weight="950" letter-spacing="1.5">WHAT PLATFORMS OFTEN EXPOSE</text>

    <g class="mono" font-size="22" font-weight="850" transform="translate(34 104)">
      <text x="0" y="0" class="orangeText">terraform apply</text>
      <text x="0" y="35" class="orangeText">helm upgrade</text>
      <text x="0" y="70" class="orangeText">kubectl apply</text>
      <text x="0" y="105" class="orangeText">provider schemas</text>
    </g>
  </g>

  <g class="sans" transform="translate(62 570)">
    <rect x="0" y="0" width="1076" height="44" rx="22" fill="url(#dark)" opacity="0.98"/>
    <text x="34" y="29" fill="#62e1e9" font-size="18" font-weight="950" letter-spacing="1.2">BIGCONFIG</text>
    <text x="158" y="29" class="white" font-size="18" font-weight="900">Tools inside. Domain verbs outside.</text>
    <text x="520" y="29" fill="#b8e9ff" font-size="18" font-weight="800">package validate · build · create · describe · delete</text>
  </g>

  <g transform="translate(798 58)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="188" rx="28" fill="#ffffff" stroke="#c8def4"/>
    <path d="M0 28 a28 28 0 0 1 28 -28 H312 a28 28 0 0 1 28 28 V72 H0 Z" fill="url(#blue)"/>
    <text x="28" y="45" class="sans white" font-size="17" font-weight="950" letter-spacing="1.4">PACKAGE BOUNDARY</text>
    <g class="sans" transform="translate(28 104)">
      <rect x="0" y="0" width="128" height="34" rx="17" fill="#ecfeff" stroke="#a5f3fc"/>
      <text x="23" y="23" class="blueText" font-size="15" font-weight="950">validate</text>
      <rect x="146" y="0" width="128" height="34" rx="17" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="176" y="23" class="blueText" font-size="15" font-weight="950">describe</text>
      <rect x="0" y="48" width="128" height="34" rx="17" fill="#f8fafc" stroke="#dbe7f4"/>
      <text x="36" y="71" class="muted" font-size="15" font-weight="950">create</text>
      <rect x="146" y="48" width="128" height="34" rx="17" fill="#f8fafc" stroke="#dbe7f4"/>
      <text x="183" y="71" class="muted" font-size="15" font-weight="950">delete</text>
    </g>
  </g>
</svg>
