<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code skills scaffold BigConfig packages in TypeScript, Python, and Clojure</title>
  <desc id="desc">A BigConfig-branded diagram showing three Claude Code package creation skills producing launcher-conformant BigConfig packages with validate, build, run, resources, tests, and bc-pkg support.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#eef8ff"/>
      <stop offset="1" stop-color="#dff7fb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0652e9"/>
      <stop offset="1" stop-color="#3a8cec"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62e1e9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="628" fill="url(#bg)"/>
  <circle cx="1060" cy="80" r="190" fill="#62e1e9" opacity="0.18"/>
  <circle cx="100" cy="560" r="220" fill="#0652e9" opacity="0.08"/>
  <path d="M -40 132 C 210 64 382 96 572 156 C 784 224 934 202 1240 88" fill="none" stroke="#0652e9" stroke-width="2" opacity="0.08"/>
  <path d="M -30 500 C 236 438 384 466 570 516 C 778 572 954 560 1238 456" fill="none" stroke="#0891b2" stroke-width="2" opacity="0.12"/>

  <g class="font">
    <text x="64" y="70" font-size="22" font-weight="800" fill="#0652e9" letter-spacing="0.5">BIGCONFIG</text>
    <text x="64" y="126" font-size="52" font-weight="850" fill="#0f172a">Scaffold BigConfig packages</text>
    <text x="64" y="170" font-size="30" font-weight="650" fill="#0652e9">with Claude Code skills</text>
    <text x="64" y="208" font-size="18" font-weight="500" fill="#334155">TypeScript · Python · Clojure starters with the same executable package contract</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="64" y="258" width="450" height="224" rx="28" fill="#ffffff"/>
    <rect x="64" y="258" width="450" height="224" rx="28" fill="none" stroke="#dbeafe" stroke-width="2"/>
    <g class="font">
      <text x="94" y="306" font-size="17" font-weight="800" fill="#0891b2" letter-spacing="0.8">CLAUDE CODE SKILLS</text>
    </g>
    <g class="mono" font-size="19" font-weight="700">
      <rect x="94" y="330" width="342" height="38" rx="12" fill="#eff6ff"/>
      <text x="112" y="355" fill="#0652e9">create-ts-bigconfig-package</text>
      <rect x="94" y="382" width="342" height="38" rx="12" fill="#ecfeff"/>
      <text x="112" y="407" fill="#0e7490">create-py-bigconfig-package</text>
      <rect x="94" y="434" width="342" height="38" rx="12" fill="#f8fafc"/>
      <text x="112" y="459" fill="#334155">create-clj-bigconfig-package</text>
    </g>
  </g>

  <g class="font">
    <circle cx="600" cy="370" r="42" fill="url(#blue)"/>
    <path d="M585 370 H610" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M603 358 L617 370 L603 382" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="600" y="430" text-anchor="middle" font-size="14" font-weight="750" fill="#0652e9">scaffold</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="686" y="258" width="450" height="224" rx="28" fill="#ffffff"/>
    <rect x="686" y="258" width="450" height="224" rx="28" fill="none" stroke="#ccfbf1" stroke-width="2"/>
    <g class="font">
      <text x="716" y="306" font-size="17" font-weight="800" fill="#0652e9" letter-spacing="0.8">BIGCONFIG PACKAGES</text>
      <g font-size="19" font-weight="750">
        <rect x="716" y="330" width="116" height="46" rx="14" fill="#eff6ff"/>
        <text x="774" y="359" text-anchor="middle" fill="#0652e9">TypeScript</text>
        <rect x="856" y="330" width="116" height="46" rx="14" fill="#ecfeff"/>
        <text x="914" y="359" text-anchor="middle" fill="#0e7490">Python</text>
        <rect x="996" y="330" width="110" height="46" rx="14" fill="#f8fafc"/>
        <text x="1051" y="359" text-anchor="middle" fill="#334155">Clojure</text>
      </g>
      <text x="716" y="410" font-size="18" font-weight="650" fill="#0f172a">Minimal real starter packages</text>
      <text x="716" y="441" font-size="15" font-weight="520" fill="#475569">root run · packaged resources · tests · bc-pkg shape</text>
    </g>
  </g>

  <g class="font" transform="translate(64 522)">
    <rect x="0" y="0" width="1072" height="62" rx="31" fill="#0f172a" opacity="0.94"/>
    <text x="536" y="39" text-anchor="middle" font-size="21" font-weight="800" fill="#ffffff">validate · build · run · resources · tests · bc-pkg</text>
  </g>
</svg>
