<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Agentic DevOps in practice</title>
  <desc id="desc">A diagram showing an operator launching a disposable Docker sandbox with bc-pkg, a pi.dev agent using describe and validate with read-only credentials, and the operator keeping create and delete outside the sandbox.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071116"/>
      <stop offset="45%" stop-color="#0d1420"/>
      <stop offset="100%" stop-color="#101018"/>
    </linearGradient>
    <radialGradient id="glow" cx="67%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#62e1e9" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#62e1e9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#62e1e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="cyanGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#62e1e9"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .muted { fill: #aab7c4; }
      .white { fill: #f8fafc; }
      .cyan { fill: #62e1e9; }
      .yellow { fill: #ffd166; }
      .panel { fill: #111827; stroke: rgba(255,255,255,0.12); }
      .soft { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.12); }
      .label { fill: #d7dee8; font-size: 18px; font-weight: 700; letter-spacing: 0.01em; }
      .small { fill: #aab7c4; font-size: 14px; }
      .tiny { fill: #94a3b8; font-size: 12px; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <circle cx="1085" cy="92" r="130" fill="#62e1e9" opacity="0.07"/>
  <circle cx="104" cy="556" r="190" fill="#ffd166" opacity="0.06"/>

  <!-- Header -->
  <g class="sans">
    <rect x="70" y="58" width="226" height="38" rx="19" fill="#0b1d25" stroke="#62e1e9" stroke-opacity="0.35"/>
    <circle cx="93" cy="77" r="7" fill="#62e1e9" filter="url(#cyanGlow)"/>
    <text x="110" y="83" fill="#dffbff" font-size="15" font-weight="700">BigConfig + pi.dev</text>

    <text x="70" y="162" class="white" font-size="68" font-weight="850" letter-spacing="-2.5">
      <tspan x="70" dy="0">Agentic DevOps</tspan>
      <tspan x="70" dy="72">in practice</tspan>
    </text>
    <text x="73" y="277" class="muted" font-size="22" font-weight="500">Sandboxed agents inspect and recommend.</text>
    <text x="73" y="309" class="muted" font-size="22" font-weight="500">Operators keep production authority.</text>
  </g>

  <!-- Terminal command -->
  <g filter="url(#shadow)">
    <rect x="70" y="360" width="520" height="126" rx="18" fill="#050b10" stroke="#263241"/>
    <rect x="70" y="360" width="520" height="34" rx="18" fill="#101a24"/>
    <circle cx="94" cy="377" r="5" fill="#ff5f57"/>
    <circle cx="112" cy="377" r="5" fill="#ffbd2e"/>
    <circle cx="130" cy="377" r="5" fill="#28c840"/>
    <text x="94" y="431" class="mono" fill="#e5f6fb" font-size="18">
      <tspan fill="#62e1e9">$</tspan> npx bc-pkg bigconfig-ai/bc-pkg
    </text>
    <text x="117" y="462" class="mono" fill="#e5f6fb" font-size="18">shell</text>
    <text x="94" y="516" class="sans" fill="#7ddce5" font-size="15" font-weight="700">no local Babashka install required</text>
  </g>

  <!-- Docker sandbox -->
  <g filter="url(#shadow)">
    <rect x="650" y="90" width="442" height="420" rx="28" fill="#0d1722" stroke="#62e1e9" stroke-width="2" stroke-opacity="0.55" stroke-dasharray="10 8"/>
    <rect x="676" y="122" width="390" height="54" rx="16" fill="#102632" stroke="#62e1e9" stroke-opacity="0.28"/>
    <text x="704" y="156" class="sans" fill="#eaffff" font-size="21" font-weight="800">Disposable Docker sandbox</text>

    <rect x="688" y="204" width="165" height="96" rx="18" class="soft"/>
    <circle cx="724" cy="238" r="18" fill="#62e1e9" opacity="0.16"/>
    <path d="M716 238h16M724 230v16" stroke="#62e1e9" stroke-width="3" stroke-linecap="round"/>
    <text x="760" y="241" class="sans label">pi.dev</text>
    <text x="709" y="275" class="sans small">agent runs here</text>

    <rect x="875" y="204" width="165" height="96" rx="18" fill="#151a20" stroke="#ffd166" stroke-opacity="0.32"/>
    <path d="M932 241v-13a20 20 0 0 1 40 0v13" fill="none" stroke="#ffd166" stroke-width="5" stroke-linecap="round"/>
    <rect x="922" y="240" width="60" height="42" rx="9" fill="#ffd166" opacity="0.22" stroke="#ffd166" stroke-opacity="0.8"/>
    <text x="911" y="331" class="sans small">read-only creds</text>

    <rect x="688" y="333" width="352" height="134" rx="20" fill="#0f1a25" stroke="#ffffff" stroke-opacity="0.13"/>
    <text x="714" y="365" class="sans label">BigConfig package verbs</text>

    <rect x="714" y="387" width="135" height="32" rx="16" fill="#12333d" stroke="#62e1e9" stroke-opacity="0.55"/>
    <text x="747" y="408" class="sans" fill="#dffcff" font-size="14" font-weight="800">describe</text>

    <rect x="863" y="387" width="135" height="32" rx="16" fill="#12333d" stroke="#62e1e9" stroke-opacity="0.55"/>
    <text x="899" y="408" class="sans" fill="#dffcff" font-size="14" font-weight="800">validate</text>

    <rect x="714" y="429" width="135" height="32" rx="16" fill="#241b12" stroke="#ffd166" stroke-opacity="0.24"/>
    <text x="752" y="450" class="sans" fill="#c7b98a" font-size="14" font-weight="800">create</text>

    <rect x="863" y="429" width="135" height="32" rx="16" fill="#241b12" stroke="#ffd166" stroke-opacity="0.24"/>
    <text x="904" y="450" class="sans" fill="#c7b98a" font-size="14" font-weight="800">delete</text>
  </g>

  <!-- Operator -->
  <g filter="url(#shadow)">
    <rect x="660" y="536" width="222" height="58" rx="18" fill="#17120b" stroke="#ffd166" stroke-opacity="0.45"/>
    <text x="686" y="572" class="sans" fill="#fff2c8" font-size="19" font-weight="850">Operator acts</text>
    <text x="816" y="572" class="sans" fill="#ffd166" font-size="18" font-weight="900">create/delete</text>
  </g>

  <!-- Arrows -->
  <path d="M590 423 C625 423 620 300 650 300" fill="none" stroke="#62e1e9" stroke-width="3" stroke-opacity="0.75" marker-end="url(#arrow)"/>
  <text x="587" y="392" class="sans tiny" fill="#8fdde5">launches sandbox</text>

  <path d="M872 510 C872 526 810 522 796 536" fill="none" stroke="#ffd166" stroke-width="3" stroke-opacity="0.75" marker-end="url(#arrow)"/>
  <text x="715" y="521" class="sans tiny" fill="#ffd166">recommendation</text>

  <!-- Footer rule -->
  <line x1="70" y1="582" x2="590" y2="582" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="70" y="608" class="sans" fill="#64748b" font-size="13" font-weight="700">describe + validate inside the sandbox • create + delete by the operator</text>
</svg>
