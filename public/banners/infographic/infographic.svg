<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="1100" viewBox="0 0 1200 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0e2a"/>
      <stop offset="50%" stop-color="#0d1235"/>
      <stop offset="100%" stop-color="#0b0e2a"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#0652e9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0652e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#62e1e9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#62e1e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0652e9"/>
      <stop offset="50%" stop-color="#62e1e9"/>
      <stop offset="100%" stop-color="#0652e9"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131743"/>
      <stop offset="100%" stop-color="#0f1340"/>
    </linearGradient>
    <linearGradient id="langGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#62e1e9"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#62e1e9"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1100" fill="url(#bgGrad)"/>
  <rect width="1200" height="1100" fill="url(#glowTop)"/>
  <rect width="1200" height="1100" fill="url(#glowCyan)"/>

  <!-- Grid pattern -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="1100"/><line x1="60" y1="0" x2="60" y2="1100"/><line x1="120" y1="0" x2="120" y2="1100"/><line x1="180" y1="0" x2="180" y2="1100"/><line x1="240" y1="0" x2="240" y2="1100"/><line x1="300" y1="0" x2="300" y2="1100"/><line x1="360" y1="0" x2="360" y2="1100"/><line x1="420" y1="0" x2="420" y2="1100"/><line x1="480" y1="0" x2="480" y2="1100"/><line x1="540" y1="0" x2="540" y2="1100"/><line x1="600" y1="0" x2="600" y2="1100"/><line x1="660" y1="0" x2="660" y2="1100"/><line x1="720" y1="0" x2="720" y2="1100"/><line x1="780" y1="0" x2="780" y2="1100"/><line x1="840" y1="0" x2="840" y2="1100"/><line x1="900" y1="0" x2="900" y2="1100"/><line x1="960" y1="0" x2="960" y2="1100"/><line x1="1020" y1="0" x2="1020" y2="1100"/><line x1="1080" y1="0" x2="1080" y2="1100"/><line x1="1140" y1="0" x2="1140" y2="1100"/><line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="540" x2="1200" y2="540"/><line x1="0" y1="600" x2="1200" y2="600"/><line x1="0" y1="660" x2="1200" y2="660"/><line x1="0" y1="720" x2="1200" y2="720"/><line x1="0" y1="780" x2="1200" y2="780"/><line x1="0" y1="840" x2="1200" y2="840"/><line x1="0" y1="900" x2="1200" y2="900"/><line x1="0" y1="960" x2="1200" y2="960"/><line x1="0" y1="1020" x2="1200" y2="1020"/><line x1="0" y1="1080" x2="1200" y2="1080"/>
  </g>

  <!-- Large decorative circles -->
  <circle cx="1000" cy="300" r="350" fill="#0652e9" opacity="0.04"/>
  <circle cx="200" cy="900" r="280" fill="#62e1e9" opacity="0.03"/>
  <circle cx="600" cy="600" r="200" fill="#0652e9" opacity="0.03"/>

  <!-- ===== HEADER ===== -->
  <!-- Logo -->
  <g transform="translate(60, 70) scale(0.3)">
    <g transform="matrix(2.6788023,0,0,2.6788023,-299.09503,-331.54731)">
      <g transform="translate(-5.8593749,18.479567)">
        <path fill="#0652e9" d="m 165.23047,182.66406 v 8.30078 L 127.63672,173.5 v -6.73438 l 37.59375,-17.46875 v 8.30469 l -28.42969,12.45313 v 0.15625 z m 22.32812,-42.58984 H 124.6875 c -2.96875,0 -5.375,2.40625 -5.375,5.375 v 49.36719 c 0,2.96875 2.40625,5.375 5.375,5.375 h 45.41797 l 17.45312,-60.11719" fill-opacity="1" fill-rule="nonzero"/>
      </g>
      <g transform="translate(-5.8593749,18.479567)">
        <path fill="#62e1e9" d="m 247.37891,142.21094 -37.59375,17.23047 v -8.30469 l 29.05468,-12.45313 v -0.15625 l -29.05468,-12.45312 v -8.30078 l 37.59375,17.23047 z m -42.36719,-33.66406 -17.45313,60.11718 h 62.76953 c 2.96485,0 5.3711,-2.40625 5.3711,-5.375 v -49.36718 c 0,-2.96875 -2.40625,-5.375 -5.3711,-5.375 h -45.3164" fill-opacity="1" fill-rule="nonzero"/>
