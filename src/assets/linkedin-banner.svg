<?xml version="1.0" encoding="UTF-8"?>
<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#0652e9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0652e9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#62e1e9" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#62e1e9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0652e9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Gradient background -->
  <rect width="1584" height="396" fill="url(#bg-gradient)"/>

  <!-- Abstract geometric shapes -->
  <!-- Large circles -->
  <circle cx="1400" cy="60" r="220" fill="#62e1e9" opacity="0.08"/>
  <circle cx="1100" cy="350" r="180" fill="#ffffff" opacity="0.06"/>
  <circle cx="600" cy="-40" r="160" fill="#0652e9" opacity="0.07"/>

  <!-- Diagonal lines pattern -->
  <line x1="300" y1="0" x2="500" y2="396" stroke="#0652e9" stroke-width="1" opacity="0.08"/>
  <line x1="450" y1="0" x2="650" y2="396" stroke="#0652e9" stroke-width="1" opacity="0.06"/>
  <line x1="600" y1="0" x2="800" y2="396" stroke="#62e1e9" stroke-width="1" opacity="0.08"/>
  <line x1="750" y1="0" x2="950" y2="396" stroke="#62e1e9" stroke-width="1" opacity="0.1"/>
  <line x1="900" y1="0" x2="1100" y2="396" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  <line x1="1050" y1="0" x2="1250" y2="396" stroke="#ffffff" stroke-width="1" opacity="0.12"/>
  <line x1="1200" y1="0" x2="1400" y2="396" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  <line x1="1350" y1="0" x2="1550" y2="396" stroke="#ffffff" stroke-width="1" opacity="0.08"/>

  <!-- Floating hexagon shapes -->
  <polygon points="200,80 230,65 260,80 260,110 230,125 200,110" fill="none" stroke="#0652e9" stroke-width="1.5" opacity="0.1"/>
  <polygon points="700,30 720,20 740,30 740,50 720,60 700,50" fill="none" stroke="#0652e9" stroke-width="1" opacity="0.12"/>
  <polygon points="1000,320 1030,305 1060,320 1060,350 1030,365 1000,350" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.15"/>
  <polygon points="1350,280 1370,270 1390,280 1390,300 1370,310 1350,300" fill="none" stroke="#62e1e9" stroke-width="1" opacity="0.2"/>
  <polygon points="480,300 510,285 540,300 540,330 510,345 480,330" fill="none" stroke="#0652e9" stroke-width="1" opacity="0.08"/>

  <!-- Dot grid -->
  <g opacity="0.06" fill="#0652e9">
    <circle cx="100" cy="50" r="2"/><circle cx="150" cy="50" r="2"/><circle cx="200" cy="50" r="2"/>
    <circle cx="100" cy="100" r="2"/><circle cx="150" cy="100" r="2"/><circle cx="200" cy="100" r="2"/>
    <circle cx="100" cy="150" r="2"/><circle cx="150" cy="150" r="2"/><circle cx="200" cy="150" r="2"/>
  </g>
  <g opacity="0.12" fill="#ffffff">
    <circle cx="1300" cy="50" r="2"/><circle cx="1350" cy="50" r="2"/><circle cx="1400" cy="50" r="2"/><circle cx="1450" cy="50" r="2"/>
    <circle cx="1300" cy="100" r="2"/><circle cx="1350" cy="100" r="2"/><circle cx="1400" cy="100" r="2"/><circle cx="1450" cy="100" r="2"/>
    <circle cx="1300" cy="150" r="2"/><circle cx="1350" cy="150" r="2"/><circle cx="1400" cy="150" r="2"/><circle cx="1450" cy="150" r="2"/>
  </g>

  <!-- Curved wave accent -->
  <path d="M 0,350 Q 400,280 800,320 T 1584,290" fill="none" stroke="#0652e9" stroke-width="1" opacity="0.08"/>
  <path d="M 0,370 Q 400,300 800,340 T 1584,310" fill="none" stroke="#62e1e9" stroke-width="1" opacity="0.1"/>

  <!-- Top glow accent -->
  <rect x="800" y="0" width="784" height="6" fill="url(#glow)" opacity="0.5"/>

  <!-- Tagline -->
  <text font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="64" fill="#ffffff" letter-spacing="1" text-anchor="end">
    <tspan x="1544" y="178">THE FIRST AGENTIC</tspan>
    <tspan x="1544" y="248">PACKAGE MANAGER</tspan>
  </text>
</svg>
